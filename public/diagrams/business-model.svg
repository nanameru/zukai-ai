<svg width="700" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="modelGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="modelGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="modelGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="350" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1F2937">ビジネスモデル</text>
  
  <!-- Top Layer: Value Proposition -->
  <rect x="200" y="80" width="300" height="100" rx="10" fill="url(#modelGrad1)" stroke="#333" stroke-width="2"/>
  <text x="350" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">価値提案</text>
  <text x="350" y="135" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">顧客に提供する価値</text>
  <text x="350" y="155" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Value Proposition</text>
  
  <!-- Arrows -->
  <path d="M 250 180 L 150 250" stroke="#6366F1" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 350 180 L 350 250" stroke="#6366F1" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 450 180 L 550 250" stroke="#6366F1" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Middle Layer -->
  <!-- Left: Customer Segments -->
  <rect x="50" y="250" width="200" height="100" rx="10" fill="url(#modelGrad2)" stroke="#333" stroke-width="2"/>
  <text x="150" y="280" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">顧客セグメント</text>
  <text x="150" y="305" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">ターゲット顧客</text>
  <text x="150" y="325" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Customer Segments</text>
  
  <!-- Center: Channels -->
  <rect x="250" y="250" width="200" height="100" rx="10" fill="url(#modelGrad3)" stroke="#333" stroke-width="2"/>
  <text x="350" y="280" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">チャネル</text>
  <text x="350" y="305" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">販売・配信経路</text>
  <text x="350" y="325" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Channels</text>
  
  <!-- Right: Revenue Streams -->
  <rect x="450" y="250" width="200" height="100" rx="10" fill="url(#modelGrad2)" stroke="#333" stroke-width="2"/>
  <text x="550" y="280" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">収益源</text>
  <text x="550" y="305" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">収益の発生方法</text>
  <text x="550" y="325" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Revenue Streams</text>
  
  <!-- Arrows -->
  <path d="M 150 350 L 150 400" stroke="#6366F1" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 350 350 L 350 400" stroke="#6366F1" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 550 350 L 550 400" stroke="#6366F1" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Bottom Layer: Key Resources -->
  <rect x="200" y="400" width="300" height="80" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
  <text x="350" y="425" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2937">主要リソース</text>
  <text x="350" y="450" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6B7280">人材・技術・資産</text>
  <text x="350" y="465" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#9CA3AF">Key Resources</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6366F1" />
    </marker>
  </defs>
</svg>
