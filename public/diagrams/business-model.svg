<svg width="800" height="550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- ドロップシャドウ -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- 矢印の先端 -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280" />
    </marker>
  </defs>

  <!-- 背景色（透明で見づらい場合は有効化） -->
  <!-- <rect width="100%" height="100%" fill="#FFFFFF" /> -->

  <!-- Title -->
  <text x="400" y="40" font-family="'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111827">ビジネスモデル構造図</text>

  <!-- Value Proposition (Center Top) -->
  <g transform="translate(250, 80)" filter="url(#shadow)">
    <!-- Background with Accent -->
    <rect width="300" height="110" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="6" rx="3" fill="#3B82F6" />
    
    <text x="150" y="40" font-family="'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1E3A8A">価値提案</text>
    <text x="150" y="70" font-family="'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif" font-size="14" text-anchor="middle" fill="#374151">顧客に提供する価値</text>
    <text x="150" y="90" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#6B7280">Value Proposition</text>
  </g>

  <!-- Middle Layer -->
  <!-- Customer Segments (Left) -->
  <g transform="translate(50, 260)" filter="url(#shadow)">
    <rect width="220" height="110" rx="8" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="6" rx="3" fill="#8B5CF6" />
    
    <text x="110" y="40" font-family="'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#4C1D95">顧客セグメント</text>
    <text x="110" y="70" font-family="'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif" font-size="13" text-anchor="middle" fill="#374151">ターゲット顧客</text>
    <text x="110" y="90" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6B7280">Customer Segments</text>
  </g>

  <!-- Channels (Center) -->
  <g transform="translate(290, 260)" filter="url(#shadow)">
    <rect width="220" height="110" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="6" rx="3" fill="#10B981" />
    
    <text x="110" y="40" font-family="'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#064E3B">チャネル</text>
    <text x="110" y="70" font-family="'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif" font-size="13" text-anchor="middle" fill="#374151">販売・配信経路</text>
    <text x="110" y="90" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6B7280">Channels</text>
  </g>

  <!-- Revenue Streams (Right) -->
  <g transform="translate(530, 260)" filter="url(#shadow)">
    <rect width="220" height="110" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="6" rx="3" fill="#F59E0B" />
    
    <text x="110" y="40" font-family="'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#78350F">収益源</text>
    <text x="110" y="70" font-family="'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif" font-size="13" text-anchor="middle" fill="#374151">収益の発生方法</text>
    <text x="110" y="90" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6B7280">Revenue Streams</text>
  </g>

  <!-- Bottom Layer: Key Resources -->
  <g transform="translate(250, 420)" filter="url(#shadow)">
    <rect width="300" height="90" rx="8" fill="#F9FAFB" stroke="#6B7280" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="6" rx="3" fill="#6B7280" />
    
    <text x="150" y="35" font-family="'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1F2937">主要リソース</text>
    <text x="150" y="60" font-family="'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif" font-size="13" text-anchor="middle" fill="#374151">人材・技術・資産</text>
    <text x="150" y="75" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6B7280">Key Resources</text>
  </g>

  <!-- Connections (Arrows) -->
  <g stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)">
    <!-- Top to Middle -->
    <path d="M 320 190 L 160 250" />
    <path d="M 400 190 L 400 250" />
    <path d="M 480 190 L 640 250" />
    
    <!-- Middle to Bottom -->
    <path d="M 160 370 L 160 400 L 300 420" stroke-dasharray="5,5" />
    <path d="M 400 370 L 400 410" />
    <path d="M 640 370 L 640 400 L 500 420" stroke-dasharray="5,5" />
  </g>

</svg>
