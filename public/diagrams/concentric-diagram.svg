<svg width="700" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="350" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1F2937">同心円図 (コア・周辺構造)</text>

  <!-- Outer Circle -->
  <circle cx="350" cy="270" r="180" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0369A1">エコシステム / 社会環境</text>
  <text x="350" y="150" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0C4A6E">規制・パートナー・インフラ</text>

  <!-- Middle Circle -->
  <circle cx="350" cy="270" r="120" fill="#BAE6FD" stroke="#38BDF8" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="200" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0284C7">市場 / 顧客セグメント</text>
  <text x="350" y="220" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#075985">ターゲット・競合・トレンド</text>

  <!-- Core Circle -->
  <circle cx="350" cy="270" r="60" fill="#0EA5E9" stroke="#0284C7" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="270" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="white">コアバリュー</text>
  <text x="350" y="290" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" dominant-baseline="middle" fill="white">Core Value</text>

  <!-- Callout lines (optional) -->
  <line x1="350" y1="270" x2="560" y2="270" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4" />
  <text x="570" y="275" font-family="Arial, sans-serif" font-size="14" fill="#4B5563">自社の強み</text>

</svg>
