<svg width="700" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="350" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#111827">同心円図 (コア・周辺構造)</text>

  <!-- Outer Circle -->
  <circle cx="350" cy="320" r="250" fill="#F0F9FF" stroke="#7DD3FC" stroke-width="2" filter="url(#shadow)"/>
  <!-- Outer Text (配置エリア: y=70〜160) -->
  <text x="350" y="110" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#0369A1">エコシステム / 社会環境</text>
  <text x="350" y="140" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#075985">規制・パートナー・インフラ</text>

  <!-- Middle Circle -->
  <circle cx="350" cy="320" r="160" fill="#BAE6FD" stroke="#38BDF8" stroke-width="2" filter="url(#shadow)"/>
  <!-- Middle Text (配置エリア: y=160〜250) -->
  <text x="350" y="200" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#0369A1">市場 / 顧客セグメント</text>
  <text x="350" y="230" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#075985">ターゲット・競合・トレンド</text>

  <!-- Core Circle -->
  <circle cx="350" cy="320" r="70" fill="#0EA5E9" stroke="#0284C7" stroke-width="3" filter="url(#shadow)"/>
  <!-- Core Text -->
  <text x="350" y="315" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="white">コアバリュー</text>
  <text x="350" y="340" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="white">Core Value</text>

  <!-- Callout lines -->
  <line x1="420" y1="320" x2="580" y2="320" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="4" />
  <text x="590" y="325" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1F2937">自社の強み</text>

</svg>
