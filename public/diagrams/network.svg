  <text x="100" y="348" text-anchor="middle" fill="#1E1B4B" font-family="Arial, sans-serif" font-size="11" font-weight="bold">チーム1</text>
  
  <circle cx="200" cy="350" r="35" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="200" y="348" text-anchor="middle" fill="#1E1B4B" font-family="Arial, sans-serif" font-size="11" font-weight="bold">チーム2</text>
  
  <circle cx="300" cy="350" r="35" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="300" y="348" text-anchor="middle" fill="#1E1B4B" font-family="Arial, sans-serif" font-size="11" font-weight="bold">チーム3</text>
  
  <circle cx="400" cy="350" r="35" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="400" y="348" text-anchor="middle" fill="#1E1B4B" font-family="Arial, sans-serif" font-size="11" font-weight="bold">チーム4</text>
  
  <circle cx="500" cy="350" r="35" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="500" y="348" text-anchor="middle" fill="#1E1B4B" font-family="Arial, sans-serif" font-size="11" font-weight="bold">チーム5</text>
  
  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="16" font-weight="bold">組織ネットワーク図</text>
