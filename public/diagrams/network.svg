  <text x="150" y="208" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Sales A</text>
  
  <circle cx="450" cy="200" r="40" fill="url(#nodeGrad3)" stroke="white" stroke-width="3"/>
  <text x="450" y="195" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">営業B</text>
  <text x="450" y="208" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Sales B</text>
  
