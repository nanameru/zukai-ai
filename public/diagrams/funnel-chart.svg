<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradFunnel1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradFunnel2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradFunnel3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradFunnel4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Stage 1: Awareness (100%) -->
  <path d="M 100 50 L 300 50 L 280 100 L 120 100 Z" fill="url(#gradFunnel1)" stroke="#1E40AF" stroke-width="2"/>
  <text x="200" y="80" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">認知 (10,000)</text>
  <text x="200" y="95" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">100%</text>
  
  <!-- Stage 2: Interest (60%) -->
  <path d="M 120 100 L 280 100 L 240 170 L 160 170 Z" fill="url(#gradFunnel2)" stroke="#059669" stroke-width="2"/>
  <text x="200" y="135" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">興味 (6,000)</text>
  <text x="200" y="150" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">60%</text>
  
  <!-- Stage 3: Consideration (30%) -->
  <path d="M 160 170 L 240 170 L 200 240 L 200 240 Z" fill="url(#gradFunnel3)" stroke="#D97706" stroke-width="2"/>
  <text x="200" y="205" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">検討 (3,000)</text>
  <text x="200" y="220" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">30%</text>
  
  <!-- Stage 4: Purchase (10%) -->
  <path d="M 200 240 L 200 240 L 180 310 L 220 310 Z" fill="url(#gradFunnel4)" stroke="#DC2626" stroke-width="2"/>
  <text x="200" y="280" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">購入 (1,000)</text>
  <text x="200" y="295" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">10%</text>
  
  <!-- Conversion rates -->
  <text x="320" y="80" fill="#6B7280" font-family="Arial, sans-serif" font-size="11">→</text>
  <text x="320" y="135" fill="#6B7280" font-family="Arial, sans-serif" font-size="11">60%</text>
  <text x="320" y="205" fill="#6B7280" font-family="Arial, sans-serif" font-size="11">50%</text>
  <text x="320" y="280" fill="#6B7280" font-family="Arial, sans-serif" font-size="11">33%</text>
  
  <!-- Title -->
  <text x="200" y="30" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="18" font-weight="bold">コンバージョンファネル</text>
  
  <!-- Bottom label -->
  <text x="200" y="350" text-anchor="middle" fill="#6B7280" font-family="Arial, sans-serif" font-size="12">最終コンバージョン率: 10%</text>
</svg>
