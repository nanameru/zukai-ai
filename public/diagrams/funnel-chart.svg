<svg width="600" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="funnelGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="funnelGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="funnelGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="funnelGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="funnelGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1F2937">ファネル図</text>
  
  <!-- Stage 1: 認知 -->
  <path d="M 150 80 L 450 80 L 420 130 L 180 130 Z" fill="url(#funnelGrad1)"/>
  <text x="300" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">認知 (10,000)</text>
  <text x="300" y="125" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">100%</text>
  
  <!-- Stage 2: 興味 -->
  <path d="M 180 130 L 420 130 L 390 180 L 210 180 Z" fill="url(#funnelGrad2)"/>
  <text x="300" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">興味 (5,000)</text>
  <text x="300" y="175" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">50%</text>
  
  <!-- Stage 3: 検討 -->
  <path d="M 210 180 L 390 180 L 360 230 L 240 230 Z" fill="url(#funnelGrad3)"/>
  <text x="300" y="210" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">検討 (2,500)</text>
  <text x="300" y="225" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">25%</text>
  
  <!-- Stage 4: 購入意欲 -->
  <path d="M 240 230 L 360 230 L 330 280 L 270 280 Z" fill="url(#funnelGrad4)"/>
  <text x="300" y="260" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">購入意欲 (1,000)</text>
  <text x="300" y="275" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">10%</text>
  
  <!-- Stage 5: 購入 -->
  <path d="M 270 280 L 330 280 L 300 330 L 300 330 Z" fill="url(#funnelGrad5)"/>
  <text x="300" y="310" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">購入 (500)</text>
  <text x="300" y="325" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">5%</text>
  
  <!-- Conversion rates -->
  <text x="50" y="400" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1F2937">コンバージョン率:</text>
  <text x="50" y="425" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">認知 → 興味: 50%</text>
  <text x="50" y="450" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">興味 → 検討: 50%</text>
  <text x="50" y="475" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">検討 → 購入意欲: 40%</text>
  <text x="50" y="500" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">購入意欲 → 購入: 50%</text>
  <text x="50" y="525" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1F2937">全体コンバージョン率: 5%</text>
  
  <!-- Drop-off analysis -->
  <text x="350" y="400" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#DC2626">離脱ポイント:</text>
  <text x="350" y="425" font-family="Arial, sans-serif" font-size="12" fill="#991B1B">• 認知→興味: 5,000人離脱</text>
  <text x="350" y="450" font-family="Arial, sans-serif" font-size="12" fill="#991B1B">• 興味→検討: 2,500人離脱</text>
  <text x="350" y="475" font-family="Arial, sans-serif" font-size="12" fill="#991B1B">• 検討→購入意欲: 1,500人離脱</text>
  <text x="350" y="500" font-family="Arial, sans-serif" font-size="12" fill="#991B1B">• 購入意欲→購入: 500人離脱</text>
</svg>
