<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- モダンなドロップシャドウ -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- カード背景用の淡いグラデーション -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F9FAFB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F3F4F6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="600" fill="white" />

  <!-- タイトル -->
  <text x="400" y="50" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111827">マーケティングファネル分析</text>
  
  <!-- メインのファンネルエリア -->
  <g transform="translate(50, 0)">
    <!-- Stage 1: 認知 -->
    <g filter="url(#shadow)">
      <path d="M 140 100 L 460 100 L 430 160 L 170 160 Z" fill="#6366F1" stroke="white" stroke-width="2"/>
      <!-- ラベル -->
      <text x="300" y="135" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">認知</text>
      
      <!-- 右側の詳細情報 -->
      <line x1="455" y1="130" x2="500" y2="130" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4"/>
      <circle cx="500" cy="130" r="3" fill="#6366F1"/>
      <text x="510" y="125" font-family="sans-serif" font-size="14" fill="#6B7280">ユーザー数</text>
      <text x="510" y="145" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1F2937">10,000</text>
      <text x="600" y="145" font-family="sans-serif" font-size="14" fill="#6366F1" font-weight="bold">(100%)</text>
    </g>
    
    <!-- Stage 2: 興味 -->
    <g filter="url(#shadow)">
      <path d="M 172 164 L 428 164 L 398 224 L 202 224 Z" fill="#8B5CF6" stroke="white" stroke-width="2"/>
      <text x="300" y="200" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">興味</text>
      
      <line x1="423" y1="194" x2="500" y2="194" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4"/>
      <circle cx="500" cy="194" r="3" fill="#8B5CF6"/>
      <text x="510" y="209" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1F2937">5,000</text>
      <text x="600" y="209" font-family="sans-serif" font-size="14" fill="#8B5CF6" font-weight="bold">(50%)</text>
    </g>
    
    <!-- Stage 3: 検討 -->
    <g filter="url(#shadow)">
      <path d="M 204 228 L 396 228 L 366 288 L 234 288 Z" fill="#A855F7" stroke="white" stroke-width="2"/>
      <text x="300" y="264" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">検討</text>
      
      <line x1="391" y1="258" x2="500" y2="258" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4"/>
      <circle cx="500" cy="258" r="3" fill="#A855F7"/>
      <text x="510" y="273" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1F2937">2,500</text>
      <text x="600" y="273" font-family="sans-serif" font-size="14" fill="#A855F7" font-weight="bold">(25%)</text>
    </g>
    
    <!-- Stage 4: 購入意欲 -->
    <g filter="url(#shadow)">
      <path d="M 236 292 L 364 292 L 334 352 L 266 352 Z" fill="#D946EF" stroke="white" stroke-width="2"/>
      <text x="300" y="328" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">意欲</text>
      
      <line x1="359" y1="322" x2="500" y2="322" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4"/>
      <circle cx="500" cy="322" r="3" fill="#D946EF"/>
      <text x="510" y="337" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1F2937">1,000</text>
      <text x="600" y="337" font-family="sans-serif" font-size="14" fill="#D946EF" font-weight="bold">(10%)</text>
    </g>
    
    <!-- Stage 5: 購入 -->
    <g filter="url(#shadow)">
      <path d="M 268 356 L 332 356 L 302 416 L 298 416 Z" fill="#EC4899" stroke="white" stroke-width="2"/>
      <text x="300" y="385" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">購入</text>
      
      <line x1="327" y1="386" x2="500" y2="386" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4"/>
      <circle cx="500" cy="386" r="3" fill="#EC4899"/>
      <text x="510" y="401" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1F2937">500</text>
      <text x="600" y="401" font-family="sans-serif" font-size="14" fill="#EC4899" font-weight="bold">(5%)</text>
    </g>
  </g>

  <!-- 下部の分析カード -->
  <g transform="translate(50, 450)">
    <!-- 左カード: コンバージョン率 -->
    <rect x="50" y="0" width="300" height="120" rx="8" fill="url(#cardBg)" stroke="#E5E7EB" />
    <text x="70" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#374151">コンバージョン率</text>
    
    <g transform="translate(70, 50)">
      <text x="0" y="15" font-family="sans-serif" font-size="12" fill="#6B7280">認知 → 興味</text>
      <rect x="120" y="5" width="100" height="8" rx="4" fill="#E5E7EB"/>
      <rect x="120" y="5" width="50" height="8" rx="4" fill="#6366F1"/>
      <text x="230" y="15" font-family="sans-serif" font-size="12" font-weight="bold" fill="#374151">50%</text>

      <text x="0" y="35" font-family="sans-serif" font-size="12" fill="#6B7280">検討 → 購入意欲</text>
      <rect x="120" y="25" width="100" height="8" rx="4" fill="#E5E7EB"/>
      <rect x="120" y="25" width="40" height="8" rx="4" fill="#A855F7"/>
      <text x="230" y="35" font-family="sans-serif" font-size="12" font-weight="bold" fill="#374151">40%</text>
      
      <text x="0" y="55" font-family="sans-serif" font-size="12" fill="#6B7280">全体 (CVR)</text>
      <rect x="120" y="45" width="100" height="8" rx="4" fill="#E5E7EB"/>
      <rect x="120" y="45" width="5" height="8" rx="4" fill="#EC4899"/>
      <text x="230" y="55" font-family="sans-serif" font-size="12" font-weight="bold" fill="#374151">5%</text>
    </g>

    <!-- 右カード: 離脱ポイント -->
    <rect x="370" y="0" width="300" height="120" rx="8" fill="url(#cardBg)" stroke="#E5E7EB" />
    <text x="390" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#374151">主な離脱ポイント</text>
    
    <g transform="translate(390, 50)">
      <path d="M 0 10 L 5 15 L 12 5" stroke="none" fill="none"/> <!-- space holder -->
      
      <g transform="translate(0, 10)">
         <circle cx="5" cy="-4" r="3" fill="#EF4444"/>
         <text x="15" y="0" font-family="sans-serif" font-size="12" fill="#4B5563">認知→興味: <tspan font-weight="bold" fill="#EF4444">5,000人</tspan> 離脱</text>
      </g>
      
      <g transform="translate(0, 30)">
         <circle cx="5" cy="-4" r="3" fill="#EF4444"/>
         <text x="15" y="0" font-family="sans-serif" font-size="12" fill="#4B5563">興味→検討: <tspan font-weight="bold" fill="#EF4444">2,500人</tspan> 離脱</text>
      </g>
      
      <g transform="translate(0, 50)">
         <circle cx="5" cy="-4" r="3" fill="#EF4444"/>
         <text x="15" y="0" font-family="sans-serif" font-size="12" fill="#4B5563">検討→購入意欲: <tspan font-weight="bold" fill="#EF4444">1,500人</tspan> 離脱</text>
      </g>
    </g>
  </g>
</svg>