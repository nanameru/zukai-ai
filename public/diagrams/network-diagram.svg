<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 洗練されたグラデーション -->
    <linearGradient id="gradHub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradNodePrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradNodeSecondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    
    <!-- 柔らかいドロップシャドウ -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="2" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="600" fill="#F9FAFB" rx="12" ry="12"/>
  
  <!-- タイトルエリア -->
  <text x="400" y="50" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111827">ネットワーク構成図</text>

  <!-- 接続線グループ（背面） -->
  <g stroke-linecap="round">
    <!-- 二次接続（破線） -->
    <path d="M200 150 L600 150 L600 450 L200 450 Z" fill="none" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="6,4"/>
    
    <!-- 主要接続（ハブから放射） -->
    <line x1="400" y1="300" x2="200" y2="150" stroke="#93C5FD" stroke-width="3" opacity="0.6"/>
    <line x1="400" y1="300" x2="600" y2="150" stroke="#93C5FD" stroke-width="3" opacity="0.6"/>
    <line x1="400" y1="300" x2="200" y2="450" stroke="#93C5FD" stroke-width="3" opacity="0.6"/>
    <line x1="400" y1="300" x2="600" y2="450" stroke="#93C5FD" stroke-width="3" opacity="0.6"/>
    <line x1="400" y1="300" x2="100" y2="300" stroke="#6EE7B7" stroke-width="3" opacity="0.6"/>
    <line x1="400" y1="300" x2="700" y2="300" stroke="#6EE7B7" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- ノードグループ -->
  <g filter="url(#softShadow)">
    <!-- ノード1 (左上) -->
    <circle cx="200" cy="150" r="40" fill="url(#gradNodePrimary)" stroke="white" stroke-width="2"/>
    <text x="200" y="155" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Node A</text>

    <!-- ノード2 (右上) -->
    <circle cx="600" cy="150" r="40" fill="url(#gradNodePrimary)" stroke="white" stroke-width="2"/>
    <text x="600" y="155" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Node B</text>

    <!-- ノード3 (左下) -->
    <circle cx="200" cy="450" r="40" fill="url(#gradNodePrimary)" stroke="white" stroke-width="2"/>
    <text x="200" y="455" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Node C</text>

    <!-- ノード4 (右下) -->
    <circle cx="600" cy="450" r="40" fill="url(#gradNodePrimary)" stroke="white" stroke-width="2"/>
    <text x="600" y="455" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Node D</text>

    <!-- ノード5 (左端) -->
    <circle cx="100" cy="300" r="35" fill="url(#gradNodeSecondary)" stroke="white" stroke-width="2"/>
    <text x="100" y="305" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Sub 1</text>

    <!-- ノード6 (右端) -->
    <circle cx="700" cy="300" r="35" fill="url(#gradNodeSecondary)" stroke="white" stroke-width="2"/>
    <text x="700" y="305" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Sub 2</text>

    <!-- 中央ハブ (最前面) -->
    <circle cx="400" cy="300" r="60" fill="url(#gradHub)" stroke="white" stroke-width="4"/>
    <text x="400" y="295" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Central</text>
    <text x="400" y="315" font-family="sans-serif" font-size="12" text-anchor="middle" fill="rgba(255,255,255,0.9)">HUB</text>
  </g>

  <!-- 凡例エリア -->
  <g transform="translate(230, 540)">
    <rect width="340" height="40" rx="20" fill="white" filter="url(#softShadow)" opacity="0.9"/>
    
    <!-- Legend items -->
    <circle cx="30" cy="20" r="8" fill="url(#gradHub)"/>
    <text x="45" y="24" font-family="sans-serif" font-size="12" fill="#4B5563">ハブ</text>
    
    <circle cx="100" cy="20" r="8" fill="url(#gradNodePrimary)"/>
    <text x="115" y="24" font-family="sans-serif" font-size="12" fill="#4B5563">主要</text>
    
    <circle cx="170" cy="20" r="8" fill="url(#gradNodeSecondary)"/>
    <text x="185" y="24" font-family="sans-serif" font-size="12" fill="#4B5563">サブ</text>
    
    <line x1="240" y1="20" x2="270" y2="20" stroke="#93C5FD" stroke-width="2"/>
    <text x="275" y="24" font-family="sans-serif" font-size="12" fill="#4B5563">接続</text>
  </g>
</svg>
