<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- グラデーション -->
    <linearGradient id="gradCloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E0F2FE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BAE6FD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradServer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F3F4F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D1D5DB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradDB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradFW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F87171;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:1" />
    </linearGradient>
    
    <!-- 矢印マーカー -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6B7280" />
    </marker>
    
    <!-- ドロップシャドウ -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- サーバーアイコン -->
    <g id="iconServer">
      <rect x="0" y="0" width="60" height="80" rx="4" fill="url(#gradServer)" stroke="#9CA3AF" stroke-width="2"/>
      <rect x="10" y="15" width="40" height="4" rx="2" fill="#9CA3AF"/>
      <rect x="10" y="25" width="40" height="4" rx="2" fill="#9CA3AF"/>
      <rect x="10" y="35" width="40" height="4" rx="2" fill="#9CA3AF"/>
      <circle cx="50" cy="70" r="3" fill="#10B981"/>
    </g>
    
    <!-- DBアイコン -->
    <g id="iconDB">
      <path d="M0,15 A30,10 0 0,0 60,15 L60,65 A30,10 0 0,1 0,65 Z" fill="url(#gradDB)" stroke="#1E40AF" stroke-width="2"/>
      <ellipse cx="30" cy="15" rx="30" ry="10" fill="#60A5FA" stroke="#1E40AF" stroke-width="2"/>
      <path d="M0,40 A30,10 0 0,0 60,40" fill="none" stroke="#1E3A8A" stroke-width="1" opacity="0.5"/>
    </g>

    <!-- ユーザーアイコン -->
    <g id="iconUser">
      <circle cx="20" cy="20" r="15" fill="#F3F4F6" stroke="#4B5563" stroke-width="2"/>
      <path d="M5,55 Q20,25 35,55 Z" fill="#F3F4F6" stroke="#4B5563" stroke-width="2" transform="translate(0,-10) scale(1.2)"/>
    </g>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="600" fill="#FFFFFF"/>
  
  <!-- タイトル -->
  <text x="400" y="40" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1F2937">Webシステム インフラ構成図</text>

  <!-- エリア定義 -->
  <!-- インターネットゾーン -->
  <rect x="50" y="80" width="700" height="120" rx="10" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="70" y="110" font-family="sans-serif" font-size="14" fill="#0369A1" font-weight="bold">Internet Zone</text>

  <!-- DMZ / Public Subnet -->
  <rect x="50" y="220" width="700" height="160" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="70" y="250" font-family="sans-serif" font-size="14" fill="#15803D" font-weight="bold">DMZ (Public Subnet)</text>

  <!-- Private Subnet -->
  <rect x="50" y="400" width="700" height="160" rx="10" fill="#FEF2F2" stroke="#FECACA" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="70" y="430" font-family="sans-serif" font-size="14" fill="#B91C1C" font-weight="bold">Private Subnet</text>

  <!-- 接続線 (fill="none" を追加して塗りつぶしを回避) -->
  <!-- User -> Cloud -->
  <path d="M150 150 L250 150" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrow-gray)"/>
  
  <!-- Cloud -> FW -->
  <path d="M400 150 L400 240" fill="none" stroke="#3B82F6" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- FW -> Web Servers -->
  <path d="M400 300 L400 320 L250 320 L250 340" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M400 300 L400 320 L550 320 L550 340" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Web Servers -> DB -->
  <path d="M250 380 L250 460 L370 460" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M550 380 L550 460 L430 460" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- アイコン配置 -->
  
  <!-- Cloud (Internet) -->
  <g transform="translate(350, 100)" filter="url(#shadow)">
    <path d="M25,50 Q10,50 10,35 Q10,20 25,20 Q30,5 50,5 Q70,5 75,20 Q90,20 90,35 Q90,50 75,50 Z" fill="url(#gradCloud)" stroke="#38BDF8" stroke-width="2" transform="scale(1.2)"/>
    <text x="60" y="35" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#0369A1">Internet</text>
  </g>

  <!-- User -->
  <g transform="translate(100, 110)" filter="url(#shadow)">
     <circle cx="25" cy="15" r="12" fill="#FFF" stroke="#4B5563" stroke-width="2"/>
     <path d="M5,50 Q25,25 45,50" fill="none" stroke="#4B5563" stroke-width="2"/>
     <text x="25" y="65" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#374151">User</text>
  </g>

  <!-- Firewall / Load Balancer -->
  <g transform="translate(370, 240)" filter="url(#shadow)">
    <rect x="0" y="0" width="60" height="60" transform="rotate(45 30 30)" fill="url(#gradFW)" stroke="#B91C1C" stroke-width="2"/>
    <text x="30" y="35" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">FW/LB</text>
  </g>

  <!-- Web Server 1 -->
  <g transform="translate(220, 300)" filter="url(#shadow)">
    <use href="#iconServer"/>
    <text x="30" y="95" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#374151">Web Server 1</text>
  </g>

  <!-- Web Server 2 -->
  <g transform="translate(520, 300)" filter="url(#shadow)">
    <use href="#iconServer"/>
    <text x="30" y="95" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#374151">Web Server 2</text>
  </g>

  <!-- Database Primary -->
  <g transform="translate(370, 450)" filter="url(#shadow)">
    <use href="#iconDB"/>
    <text x="30" y="85" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#374151">Master DB</text>
  </g>

  <!-- 凡例・補足 -->
  <rect x="600" y="530" width="150" height="50" rx="5" fill="white" stroke="#E5E7EB" stroke-width="1"/>
  <text x="675" y="545" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#6B7280">Security Groups</text>
  <line x1="620" y1="560" x2="650" y2="560" stroke="#3B82F6" stroke-width="2"/>
  <text x="660" y="563" font-family="sans-serif" font-size="10" fill="#374151">Allowed Traffic</text>

</svg>
