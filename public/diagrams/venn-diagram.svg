<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="circle1">
      <circle cx="200" cy="200" r="100"/>
    </clipPath>
    <clipPath id="circle2">
      <circle cx="300" cy="200" r="100"/>
    </clipPath>
    <clipPath id="circle3">
      <circle cx="250" cy="150" r="100"/>
    </clipPath>
  </defs>
  
  <!-- Circle 1 -->
  <circle cx="200" cy="200" r="100" fill="#4F46E5" fill-opacity="0.4" stroke="#312E81" stroke-width="3"/>
  <text x="200" y="120" text-anchor="middle" fill="#312E81" font-family="Arial, sans-serif" font-size="16" font-weight="bold">セットA</text>
  <text x="200" y="140" text-anchor="middle" fill="#312E81" font-family="Arial, sans-serif" font-size="12">技術</text>
  
  <!-- Circle 2 -->
  <circle cx="300" cy="200" r="100" fill="#10B981" fill-opacity="0.4" stroke="#059669" stroke-width="3"/>
  <text x="300" y="120" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="16" font-weight="bold">セットB</text>
  <text x="300" y="140" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="12">デザイン</text>
  
  <!-- Circle 3 -->
  <circle cx="250" cy="150" r="100" fill="#F59E0B" fill-opacity="0.4" stroke="#D97706" stroke-width="3"/>
  <text x="250" y="30" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="16" font-weight="bold">セットC</text>
  <text x="250" y="50" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="12">マーケティング</text>
  
  <!-- Intersection A ∩ B -->
  <path d="M 200 200 A 100 100 0 0 1 300 200 A 100 100 0 0 1 200 200 Z" 
        fill="#6366F1" fill-opacity="0.6" stroke="#312E81" stroke-width="2"/>
  <text x="250" y="200" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="12" font-weight="bold">A ∩ B</text>
  <text x="250" y="220" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="10">UI/UX</text>
  
  <!-- Intersection A ∩ C -->
  <path d="M 200 200 A 100 100 0 0 1 250 150 A 100 100 0 0 1 200 200 Z" 
        fill="#818CF8" fill-opacity="0.6" stroke="#312E81" stroke-width="2"/>
  <text x="200" y="160" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="12" font-weight="bold">A ∩ C</text>
  <text x="200" y="175" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="10">技術マーケ</text>
  
  <!-- Intersection B ∩ C -->
  <path d="M 300 200 A 100 100 0 0 1 250 150 A 100 100 0 0 1 300 200 Z" 
        fill="#34D399" fill-opacity="0.6" stroke="#059669" stroke-width="2"/>
  <text x="300" y="160" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="12" font-weight="bold">B ∩ C</text>
  <text x="300" y="175" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="10">デザインPR</text>
  
  <!-- Intersection A ∩ B ∩ C -->
  <path d="M 250 150 A 100 100 0 0 1 200 200 A 100 100 0 0 1 300 200 A 100 100 0 0 1 250 150 Z" 
        fill="#A78BFA" fill-opacity="0.8" stroke="#312E81" stroke-width="2"/>
  <text x="250" y="180" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="11" font-weight="bold">A ∩ B ∩ C</text>
  <text x="250" y="195" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="9">統合</text>
  
  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="18" font-weight="bold">ベン図</text>
  
  <!-- Description -->
  <text x="300" y="350" text-anchor="middle" fill="#6B7280" font-family="Arial, sans-serif" font-size="12">3つの集合の関係性を可視化</text>
</svg>
