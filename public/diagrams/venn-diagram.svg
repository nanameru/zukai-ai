<svg width="500" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vennGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="vennGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="vennGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  
  <!-- Circle 1 -->
  <circle cx="180" cy="180" r="100" fill="url(#vennGrad1)" stroke="#1E3A8A" stroke-width="2"/>
  <text x="180" y="100" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="14" font-weight="bold">技術</text>
  <text x="180" y="115" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="12">Technology</text>
  
  <!-- Circle 2 -->
  <circle cx="320" cy="180" r="100" fill="url(#vennGrad2)" stroke="#065F46" stroke-width="2"/>
  <text x="320" y="100" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="14" font-weight="bold">ビジネス</text>
  <text x="320" y="115" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="12">Business</text>
  
  <!-- Circle 3 -->
  <circle cx="250" cy="280" r="100" fill="url(#vennGrad3)" stroke="#92400E" stroke-width="2"/>
  <text x="250" y="400" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="14" font-weight="bold">デザイン</text>
  <text x="250" y="415" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="12">Design</text>
  
  <!-- Intersection labels -->
  <text x="250" y="200" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="13" font-weight="bold">技術×ビジネス</text>
  <text x="215" y="240" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="13" font-weight="bold">技術×デザイン</text>
  <text x="285" y="240" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="13" font-weight="bold">ビジネス×デザイン</text>
  
  <!-- Center intersection -->
  <text x="250" y="220" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="14" font-weight="bold">イノベーション</text>
  <text x="250" y="235" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="12">Innovation</text>
  
  <!-- Title -->
  <text x="250" y="30" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="16" font-weight="bold">ベン図：イノベーションの重なり</text>
</svg>
