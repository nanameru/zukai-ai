<svg width="700" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradClient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradServer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradDB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Client Layer -->
  <rect x="50" y="50" width="600" height="80" rx="10" fill="url(#gradClient)" stroke="#1E40AF" stroke-width="2" opacity="0.9"/>
  <text x="350" y="80" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">クライアント層</text>
  
  <rect x="100" y="100" width="120" height="20" rx="4" fill="white" opacity="0.9"/>
  <text x="160" y="113" text-anchor="middle" fill="#1E40AF" font-family="Arial, sans-serif" font-size="11">Webブラウザ</text>
  
  <rect x="250" y="100" width="120" height="20" rx="4" fill="white" opacity="0.9"/>
  <text x="310" y="113" text-anchor="middle" fill="#1E40AF" font-family="Arial, sans-serif" font-size="11">モバイルアプリ</text>
  
  <rect x="400" y="100" width="120" height="20" rx="4" fill="white" opacity="0.9"/>
  <text x="460" y="113" text-anchor="middle" fill="#1E40AF" font-family="Arial, sans-serif" font-size="11">デスクトップ</text>
  
  <!-- API Gateway -->
  <rect x="250" y="180" width="200" height="60" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="350" y="205" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="14" font-weight="bold">API Gateway</text>
  <text x="350" y="225" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="11">認証・ルーティング</text>
  
  <!-- Arrows from Client to API -->
  <path d="M 160 130 L 300 180" stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 310 130 L 350 180" stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 460 130 L 400 180" stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Server Layer -->
  <rect x="50" y="280" width="600" height="100" rx="10" fill="url(#gradServer)" stroke="#059669" stroke-width="2" opacity="0.9"/>
  <text x="350" y="310" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">アプリケーション層</text>
  
  <rect x="100" y="330" width="150" height="40" rx="6" fill="white" opacity="0.9"/>
  <text x="175" y="350" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="12" font-weight="bold">認証サービス</text>
  <text x="175" y="363" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="10">Auth Service</text>
  
  <rect x="275" y="330" width="150" height="40" rx="6" fill="white" opacity="0.9"/>
  <text x="350" y="350" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="12" font-weight="bold">ビジネスロジック</text>
  <text x="350" y="363" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="10">Business Logic</text>
  
  <rect x="450" y="330" width="150" height="40" rx="6" fill="white" opacity="0.9"/>
  <text x="525" y="350" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="12" font-weight="bold">通知サービス</text>
  <text x="525" y="363" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="10">Notification</text>
  
  <!-- Arrows from API to Services -->
  <path d="M 300 240 L 175 330" stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 350 240 L 350 330" stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 400 240 L 525 330" stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Database Layer -->
  <rect x="50" y="420" width="600" height="60" rx="10" fill="url(#gradDB)" stroke="#7C3AED" stroke-width="2" opacity="0.9"/>
  <text x="350" y="450" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">データ層</text>
  
  <rect x="150" y="460" width="120" height="10" rx="2" fill="white" opacity="0.9"/>
  <text x="210" y="468" text-anchor="middle" fill="#6D28D9" font-family="Arial, sans-serif" font-size="10">PostgreSQL</text>
  
  <rect x="290" y="460" width="120" height="10" rx="2" fill="white" opacity="0.9"/>
  <text x="350" y="468" text-anchor="middle" fill="#6D28D9" font-family="Arial, sans-serif" font-size="10">Redis Cache</text>
  
  <rect x="430" y="460" width="120" height="10" rx="2" fill="white" opacity="0.9"/>
  <text x="490" y="468" text-anchor="middle" fill="#6D28D9" font-family="Arial, sans-serif" font-size="10">Object Storage</text>
  
  <!-- Arrows from Services to DB -->
  <path d="M 175 370 L 210 460" stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 350 370 L 350 460" stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 525 370 L 490 460" stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6B7280" />
    </marker>
  </defs>
</svg>
