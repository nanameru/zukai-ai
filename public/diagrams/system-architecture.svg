<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="archGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1F2937">システムアーキテクチャ</text>
  
  <!-- Client Layer -->
  <rect x="50" y="70" width="700" height="80" rx="10" fill="#E0E7FF" stroke="#6366F1" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="400" y="95" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#4F46E5">クライアント層</text>
  
  <rect x="150" y="110" width="120" height="30" rx="5" fill="white" stroke="#6366F1" stroke-width="1"/>
  <text x="210" y="130" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1F2937">Webブラウザ</text>
  
  <rect x="300" y="110" width="120" height="30" rx="5" fill="white" stroke="#6366F1" stroke-width="1"/>
  <text x="360" y="130" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1F2937">モバイルアプリ</text>
  
  <rect x="450" y="110" width="120" height="30" rx="5" fill="white" stroke="#6366F1" stroke-width="1"/>
  <text x="510" y="130" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1F2937">デスクトップ</text>
  
  <!-- Arrow -->
  <path d="M 400 150 L 400 180" stroke="#6366F1" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- API Gateway -->
  <rect x="300" y="180" width="200" height="60" rx="10" fill="url(#archGrad)" stroke="#333" stroke-width="2"/>
  <text x="400" y="205" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">API Gateway</text>
  <text x="400" y="225" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">認証・ルーティング</text>
  
  <!-- Arrows -->
  <path d="M 400 240 L 400 270" stroke="#6366F1" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Application Layer -->
  <rect x="50" y="270" width="700" height="100" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="400" y="295" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1E40AF">アプリケーション層</text>
  
  <rect x="100" y="310" width="150" height="50" rx="5" fill="white" stroke="#3B82F6" stroke-width="1"/>
  <text x="175" y="330" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1F2937">認証サービス</text>
  <text x="175" y="345" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6B7280">Auth Service</text>
  
  <rect x="275" y="310" width="150" height="50" rx="5" fill="white" stroke="#3B82F6" stroke-width="1"/>
  <text x="350" y="330" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1F2937">ビジネスロジック</text>
  <text x="350" y="345" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6B7280">Business Logic</text>
  
  <rect x="450" y="310" width="150" height="50" rx="5" fill="white" stroke="#3B82F6" stroke-width="1"/>
  <text x="525" y="330" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1F2937">通知サービス</text>
  <text x="525" y="345" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6B7280">Notification</text>
  
  <!-- Arrows -->
  <path d="M 400 370 L 400 400" stroke="#6366F1" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Data Layer -->
  <rect x="50" y="400" width="700" height="80" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="400" y="425" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#065F46">データ層</text>
  
  <rect x="150" y="440" width="120" height="30" rx="5" fill="white" stroke="#10B981" stroke-width="1"/>
  <text x="210" y="458" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1F2937">データベース</text>
  
  <rect x="300" y="440" width="120" height="30" rx="5" fill="white" stroke="#10B981" stroke-width="1"/>
  <text x="360" y="458" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1F2937">キャッシュ</text>
  
  <rect x="450" y="440" width="120" height="30" rx="5" fill="white" stroke="#10B981" stroke-width="1"/>
  <text x="510" y="458" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1F2937">ストレージ</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6366F1" />
    </marker>
  </defs>
</svg>
