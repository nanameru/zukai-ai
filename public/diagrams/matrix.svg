<svg width="500" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="matrixGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="matrixGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="matrixGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="matrixGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Grid lines -->
  <line x1="250" y1="50" x2="250" y2="450" stroke="#9CA3AF" stroke-width="2"/>
  <line x1="50" y1="250" x2="450" y2="250" stroke="#9CA3AF" stroke-width="2"/>
  
  <!-- Quadrant 1: High Impact, High Effort -->
  <rect x="250" y="50" width="200" height="200" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1" opacity="0.5"/>
  <rect x="280" y="80" width="140" height="100" rx="8" fill="url(#matrixGrad1)" stroke="white" stroke-width="2"/>
  <text x="350" y="120" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">大型プロジェクト</text>
  <text x="350" y="140" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Big Projects</text>
  <text x="350" y="160" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9">計画して実行</text>
  
  <!-- Quadrant 2: High Impact, Low Effort -->
  <rect x="50" y="50" width="200" height="200" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1" opacity="0.5"/>
  <rect x="80" y="80" width="140" height="100" rx="8" fill="url(#matrixGrad2)" stroke="white" stroke-width="2"/>
  <text x="150" y="120" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">クイックウィン</text>
  <text x="150" y="140" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Quick Wins</text>
  <text x="150" y="160" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9">優先的に実行</text>
  
  <!-- Quadrant 3: Low Impact, Low Effort -->
  <rect x="50" y="250" width="200" height="200" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1" opacity="0.5"/>
  <rect x="80" y="320" width="140" height="100" rx="8" fill="url(#matrixGrad3)" stroke="white" stroke-width="2"/>
  <text x="150" y="360" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">埋め込み作業</text>
  <text x="150" y="380" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Fill-ins</text>
  <text x="150" y="400" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9">余裕があれば</text>
  
  <!-- Quadrant 4: Low Impact, High Effort -->
  <rect x="250" y="250" width="200" height="200" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1" opacity="0.5"/>
  <rect x="280" y="320" width="140" height="100" rx="8" fill="url(#matrixGrad4)" stroke="white" stroke-width="2"/>
  <text x="350" y="360" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">時間の無駄</text>
  <text x="350" y="380" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Time Wasters</text>
  <text x="350" y="400" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9">避けるべき</text>
  
  <!-- Axis labels -->
  <text x="250" y="35" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="13" font-weight="bold">高影響度</text>
  <text x="250" y="480" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="13" font-weight="bold">低影響度</text>
  <text x="30" y="250" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="13" font-weight="bold" transform="rotate(-90 30 250)">低工数</text>
  <text x="470" y="250" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="13" font-weight="bold" transform="rotate(-90 470 250)">高工数</text>
  
  <!-- Title -->
  <text x="250" y="25" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="16" font-weight="bold">優先順位マトリックス</text>
</svg>
