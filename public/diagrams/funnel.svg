<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="funnelGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="funnelGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="funnelGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="funnelGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Stage 1: Awareness -->
  <rect x="50" y="50" width="300" height="80" rx="8" fill="url(#funnelGrad1)" stroke="white" stroke-width="2"/>
  <text x="200" y="80" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">認知</text>
  <text x="200" y="100" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">Awareness</text>
  <text x="200" y="118" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">10,000人</text>
  
  <!-- Stage 2: Interest -->
  <rect x="80" y="150" width="240" height="80" rx="8" fill="url(#funnelGrad2)" stroke="white" stroke-width="2"/>
  <text x="200" y="180" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">興味</text>
  <text x="200" y="200" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">Interest</text>
  <text x="200" y="218" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">3,000人 (30%)</text>
  
  <!-- Stage 3: Consideration -->
  <rect x="110" y="250" width="180" height="80" rx="8" fill="url(#funnelGrad3)" stroke="white" stroke-width="2"/>
  <text x="200" y="280" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">検討</text>
  <text x="200" y="300" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">Consideration</text>
  <text x="200" y="318" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">1,000人 (10%)</text>
  
  <!-- Stage 4: Purchase -->
  <rect x="140" y="350" width="120" height="80" rx="8" fill="url(#funnelGrad4)" stroke="white" stroke-width="2"/>
  <text x="200" y="380" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">購入</text>
  <text x="200" y="400" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">Purchase</text>
  <text x="200" y="418" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">300人 (3%)</text>
  
  <!-- Title -->
  <text x="200" y="30" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="16" font-weight="bold">マーケティングファネル</text>
</svg>
