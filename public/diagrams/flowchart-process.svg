<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Start -->
  <rect x="250" y="20" width="100" height="50" rx="10" fill="url(#grad1)" stroke="#333" stroke-width="2"/>
  <text x="300" y="50" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">開始</text>
  
  <!-- Arrow -->
  <path d="M 300 70 L 300 100" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Process 1 -->
  <rect x="200" y="100" width="200" height="50" rx="10" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="300" y="130" text-anchor="middle" fill="#1E1B4B" font-family="Arial, sans-serif" font-size="14">プロセス1</text>
  
  <!-- Arrow -->
  <path d="M 300 150 L 300 180" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Decision -->
  <polygon points="300,180 350,220 300,260 250,220" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="300" y="220" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="12">判定</text>
  
  <!-- Yes Arrow -->
  <path d="M 350 220 L 420 220" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="385" y="215" fill="#333" font-family="Arial, sans-serif" font-size="12">Yes</text>
  
  <!-- No Arrow -->
  <path d="M 250 220 L 180 220" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="215" y="215" fill="#333" font-family="Arial, sans-serif" font-size="12">No</text>
  
  <!-- Process 2 (Yes) -->
  <rect x="420" y="190" width="120" height="60" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="480" y="220" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="12">成功処理</text>
  
  <!-- Process 3 (No) -->
  <rect x="60" y="190" width="120" height="60" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
  <text x="120" y="220" text-anchor="middle" fill="#991B1B" font-family="Arial, sans-serif" font-size="12">エラー処理</text>
  
  <!-- End -->
  <rect x="250" y="320" width="100" height="50" rx="10" fill="url(#grad1)" stroke="#333" stroke-width="2"/>
  <text x="300" y="350" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">終了</text>
  
  <!-- Arrow from Process 2 -->
  <path d="M 480 250 L 480 300 L 300 300" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow from Process 3 -->
  <path d="M 120 250 L 120 300 L 300 300" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
  </defs>
</svg>
