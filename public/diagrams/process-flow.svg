<svg width="600" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6366F1" />
    </marker>
  </defs>
  
  <!-- Step 1 -->
  <rect x="50" y="100" width="100" height="80" rx="10" fill="#4F46E5" stroke="#312E81" stroke-width="2"/>
  <text x="100" y="135" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">計画</text>
  <text x="100" y="155" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">Plan</text>
  <text x="100" y="170" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">要件定義</text>
  
  <!-- Arrow 1 -->
  <line x1="150" y1="140" x2="200" y2="140" stroke="#6366F1" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2 -->
  <rect x="200" y="100" width="100" height="80" rx="10" fill="#6366F1" stroke="#312E81" stroke-width="2"/>
  <text x="250" y="135" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">開発</text>
  <text x="250" y="155" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">Develop</text>
  <text x="250" y="170" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">実装・テスト</text>
  
  <!-- Arrow 2 -->
  <line x1="300" y1="140" x2="350" y2="140" stroke="#6366F1" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3 -->
  <rect x="350" y="100" width="100" height="80" rx="10" fill="#818CF8" stroke="#312E81" stroke-width="2"/>
  <text x="400" y="135" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">レビュー</text>
  <text x="400" y="155" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">Review</text>
  <text x="400" y="170" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">品質確認</text>
  
  <!-- Arrow 3 -->
  <line x1="450" y1="140" x2="500" y2="140" stroke="#6366F1" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Step 4 -->
  <rect x="450" y="100" width="100" height="80" rx="10" fill="#A78BFA" stroke="#312E81" stroke-width="2"/>
  <text x="500" y="135" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">リリース</text>
  <text x="500" y="155" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">Release</text>
  <text x="500" y="170" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">本番展開</text>
  
  <!-- Feedback loop -->
  <path d="M 500 180 Q 550 200 550 250 Q 550 300 100 300 Q 50 300 50 200 Q 50 180 50 180" 
        stroke="#C4B5FD" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="300" y="295" text-anchor="middle" fill="#6366F1" font-family="Arial, sans-serif" font-size="10">改善フィードバック</text>
</svg>
