<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1F2937">プロセスフロー</text>
  
  <!-- Start -->
  <rect x="250" y="60" width="100" height="50" rx="5" fill="url(#flowGrad)" stroke="#333" stroke-width="2"/>
  <text x="300" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">開始</text>
  
  <!-- Arrow -->
  <path d="M 300 110 L 300 140" stroke="#4F46E5" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Process 1 -->
  <rect x="200" y="150" width="200" height="50" rx="5" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="300" y="180" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1F2937">プロセス1</text>
  
  <!-- Arrow -->
  <path d="M 300 200 L 300 230" stroke="#4F46E5" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Decision -->
  <polygon points="300,240 350,270 300,300 250,270" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="300" y="275" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#92400E">判断</text>
  
  <!-- Yes Arrow -->
  <path d="M 350 270 L 420 270" stroke="#10B981" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="385" y="265" font-family="Arial, sans-serif" font-size="12" fill="#059669">Yes</text>
  
  <!-- No Arrow -->
  <path d="M 250 270 L 180 270" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="215" y="265" font-family="Arial, sans-serif" font-size="12" fill="#DC2626">No</text>
  
  <!-- Process 2 (Yes) -->
  <rect x="420" y="240" width="120" height="60" rx="5" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="480" y="265" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#065F46">プロセス2</text>
  <text x="480" y="285" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#065F46">(成功)</text>
  
  <!-- Process 3 (No) -->
  <rect x="60" y="240" width="120" height="60" rx="5" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
  <text x="120" y="265" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#991B1B">プロセス3</text>
  <text x="120" y="285" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#991B1B">(再処理)</text>
  
  <!-- End -->
  <rect x="250" y="330" width="100" height="50" rx="5" fill="url(#flowGrad)" stroke="#333" stroke-width="2"/>
  <text x="300" y="360" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">終了</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4F46E5" />
    </marker>
  </defs>
</svg>
