<svg width="600" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>
    
    <marker id="arrow-main" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4F46E5" />
    </marker>
    <marker id="arrow-success" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-error" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6B7280" />
    </marker>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="white" rx="10" />

  <!-- Title -->
  <text x="300" y="35" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#1F2937">プロセスフロー図</text>

  <!-- Main Path: Start -> P1 -->
  <path d="M 300 100 L 300 130" stroke="#4F46E5" stroke-width="2" marker-end="url(#arrow-main)"/>
  
  <!-- Main Path: P1 -> Decision -->
  <path d="M 300 180 L 300 210" stroke="#4F46E5" stroke-width="2" marker-end="url(#arrow-main)"/>

  <!-- Start Node -->
  <g filter="url(#dropShadow)">
    <rect x="240" y="50" width="120" height="50" rx="25" fill="url(#mainGrad)" stroke="#312E81" stroke-width="1"/>
    <text x="300" y="81" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">開始</text>
  </g>

  <!-- Process 1 -->
  <g filter="url(#dropShadow)">
    <rect x="200" y="130" width="200" height="50" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
    <text x="300" y="161" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1F2937">プロセス処理</text>
  </g>

  <!-- Decision Node -->
  <g transform="translate(300, 240)" filter="url(#dropShadow)">
    <polygon points="0,-30 60,0 0,30 -60,0" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <text x="0" y="5" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#92400E">判定</text>
  </g>

  <!-- Path: Decision -> Success (Right) -->
  <path d="M 360 240 L 440 240" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-success)"/>
  <text x="390" y="230" font-family="sans-serif" font-size="12" fill="#059669" font-weight="bold">Yes</text>

  <!-- Path: Decision -> Error (Left) -->
  <path d="M 240 240 L 160 240" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow-error)"/>
  <text x="210" y="230" font-family="sans-serif" font-size="12" fill="#DC2626" font-weight="bold">No</text>

  <!-- Success Node -->
  <g filter="url(#dropShadow)">
    <rect x="440" y="215" width="120" height="50" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
    <text x="500" y="245" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#065F46">次の工程へ</text>
  </g>

  <!-- Error Node -->
  <g filter="url(#dropShadow)">
    <rect x="40" y="215" width="120" height="50" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
    <text x="100" y="245" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#991B1B">エラー対応</text>
  </g>

  <!-- Convergence Lines to End -->
  <!-- Success -> End -->
  <path d="M 500 265 L 500 310 L 300 310 L 300 340" stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#arrow-gray)"/>
  
  <!-- Error -> End -->
  <path d="M 100 265 L 100 310 L 300 310" stroke="#6B7280" stroke-width="2" fill="none"/>

  <!-- End Node -->
  <g filter="url(#dropShadow)">
    <rect x="240" y="340" width="120" height="50" rx="25" fill="url(#mainGrad)" stroke="#312E81" stroke-width="1"/>
    <text x="300" y="371" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">終了</text>
  </g>

</svg>