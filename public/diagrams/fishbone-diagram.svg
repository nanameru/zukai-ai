<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151" />
    </marker>
  </defs>
  
  <!-- 背景（透過背景だと見にくい場合があるため白背景を追加、不要なら削除可） -->
  <rect width="800" height="500" fill="#ffffff" opacity="0" />

  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1F2937">フィッシュボーン図（原因分析）</text>

  <!-- Main spine (背骨) -->
  <line x1="50" y1="250" x2="680" y2="250" stroke="#374151" stroke-width="4" marker-end="url(#arrowhead)"/>

  <!-- Head / Problem (問題) -->
  <rect x="680" y="210" width="100" height="80" rx="8" fill="#EF4444" stroke="#DC2626" stroke-width="2"/>
  <text x="730" y="245" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">問題</text>
  <text x="730" y="270" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">品質低下</text>

  <!-- ========================================== -->
  <!-- 上側の枝 (Top Branches) -->
  <!-- ========================================== -->

  <!-- Category 1: 人材 (Man) -->
  <g transform="translate(200, 250)">
    <!-- 大骨 -->
    <line x1="0" y1="0" x2="-60" y2="-140" stroke="#3B82F6" stroke-width="2" />
    <text x="-60" y="-150" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E40AF" text-anchor="middle">人材</text>
    
    <!-- 小骨 1 -->
    <line x1="-20" y1="-45" x2="-90" y2="-45" stroke="#3B82F6" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="-95" y="-40" font-family="Arial, sans-serif" font-size="12" fill="#374151" text-anchor="end">スキル不足</text>
    
    <!-- 小骨 2 -->
    <line x1="-40" y1="-90" x2="-110" y2="-90" stroke="#3B82F6" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="-115" y="-85" font-family="Arial, sans-serif" font-size="12" fill="#374151" text-anchor="end">経験・教育不足</text>
  </g>

  <!-- Category 2: 機械 (Machine) -->
  <g transform="translate(400, 250)">
    <!-- 大骨 -->
    <line x1="0" y1="0" x2="-60" y2="-140" stroke="#F59E0B" stroke-width="2" />
    <text x="-60" y="-150" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#92400E" text-anchor="middle">機械</text>
    
    <!-- 小骨 1 -->
    <line x1="-20" y1="-45" x2="-90" y2="-45" stroke="#F59E0B" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="-95" y="-40" font-family="Arial, sans-serif" font-size="12" fill="#374151" text-anchor="end">故障頻発</text>
    
    <!-- 小骨 2 -->
    <line x1="-40" y1="-90" x2="-110" y2="-90" stroke="#F59E0B" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="-115" y="-85" font-family="Arial, sans-serif" font-size="12" fill="#374151" text-anchor="end">メンテ・性能不足</text>
  </g>

  <!-- Category 3: 測定 (Measurement) -->
  <g transform="translate(600, 250)">
    <!-- 大骨 -->
    <line x1="0" y1="0" x2="-60" y2="-140" stroke="#6366F1" stroke-width="2" />
    <text x="-60" y="-150" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4338CA" text-anchor="middle">測定</text>
    
    <!-- 小骨 1 -->
    <line x1="-20" y1="-45" x2="-90" y2="-45" stroke="#6366F1" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="-95" y="-40" font-family="Arial, sans-serif" font-size="12" fill="#374151" text-anchor="end">測定誤差</text>
    
    <!-- 小骨 2 -->
    <line x1="-40" y1="-90" x2="-110" y2="-90" stroke="#6366F1" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="-115" y="-85" font-family="Arial, sans-serif" font-size="12" fill="#374151" text-anchor="end">基準・計器不良</text>
  </g>

  <!-- ========================================== -->
  <!-- 下側の枝 (Bottom Branches) -->
  <!-- ========================================== -->

  <!-- Category 4: 方法 (Method) -->
  <g transform="translate(200, 250)">
    <!-- 大骨 -->
    <line x1="0" y1="0" x2="-60" y2="140" stroke="#8B5CF6" stroke-width="2" />
    <text x="-60" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#5B21B6" text-anchor="middle">方法</text>
    
    <!-- 小骨 1 -->
    <line x1="-20" y1="45" x2="-90" y2="45" stroke="#8B5CF6" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="-95" y="50" font-family="Arial, sans-serif" font-size="12" fill="#374151" text-anchor="end">プロセス不備</text>
    
    <!-- 小骨 2 -->
    <line x1="-40" y1="90" x2="-110" y2="90" stroke="#8B5CF6" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="-115" y="95" font-family="Arial, sans-serif" font-size="12" fill="#374151" text-anchor="end">標準化不足</text>
  </g>

  <!-- Category 5: 材料 (Material) -->
  <g transform="translate(400, 250)">
    <!-- 大骨 -->
    <line x1="0" y1="0" x2="-60" y2="140" stroke="#10B981" stroke-width="2" />
    <text x="-60" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#065F46" text-anchor="middle">材料</text>
    
    <!-- 小骨 1 -->
    <line x1="-20" y1="45" x2="-90" y2="45" stroke="#10B981" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="-95" y="50" font-family="Arial, sans-serif" font-size="12" fill="#374151" text-anchor="end">品質不良</text>
    
    <!-- 小骨 2 -->
    <line x1="-40" y1="90" x2="-110" y2="90" stroke="#10B981" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="-115" y="95" font-family="Arial, sans-serif" font-size="12" fill="#374151" text-anchor="end">仕様不一致</text>
  </g>

  <!-- Category 6: 環境 (Environment) -->
  <g transform="translate(600, 250)">
    <!-- 大骨 -->
    <line x1="0" y1="0" x2="-60" y2="140" stroke="#EF4444" stroke-width="2" />
    <text x="-60" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#991B1B" text-anchor="middle">環境</text>
    
    <!-- 小骨 1 -->
    <line x1="-20" y1="45" x2="-90" y2="45" stroke="#EF4444" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="-95" y="50" font-family="Arial, sans-serif" font-size="12" fill="#374151" text-anchor="end">作業環境不良</text>
    
    <!-- 小骨 2 -->
    <line x1="-40" y1="90" x2="-110" y2="90" stroke="#EF4444" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="-115" y="95" font-family="Arial, sans-serif" font-size="12" fill="#374151" text-anchor="end">照明・温度</text>
  </g>

</svg>