<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead-main" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M0,2 L12,6 L0,10 L2,6 Z" fill="#1F2937" />
    </marker>
    <marker id="arrowhead-sub" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L8,4 L0,7 L1,4 Z" fill="#4B5563" />
    </marker>
    <!-- ドロップシャドウフィルター -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="900" height="600" fill="#F9FAFB" />

  <!-- Title -->
  <text x="450" y="50" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" text-anchor="middle" fill="#111827">フィッシュボーン図（特性要因図）</text>

  <!-- Main spine (背骨) -->
  <line x1="50" y1="300" x2="750" y2="300" stroke="#1F2937" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowhead-main)"/>

  <!-- Head / Problem (問題) -->
  <g transform="translate(760, 260)" filter="url(#shadow)">
    <path d="M0,0 L120,0 A5,5 0 0 1 125,5 L125,75 A5,5 0 0 1 120,80 L0,80 L-20,40 Z" fill="#DC2626" />
    <text x="60" y="30" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">問題</text>
    <text x="60" y="55" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">品質低下</text>
  </g>

  <!-- ========================================== -->
  <!-- Styles Definitions -->
  <!-- ========================================== -->
  <!-- 
    人材: Blue (#2563EB)
    機械: Orange (#D97706)
    測定: Indigo (#4F46E5)
    方法: Purple (#7C3AED)
    材料: Emerald (#059669)
    環境: Rose (#E11D48)
  -->

  <!-- ========================================== -->
  <!-- 上側の枝 (Top Branches) -->
  <!-- ========================================== -->

  <!-- Category 1: 人材 (Man) -->
  <g transform="translate(200, 300)">
    <!-- 接合点 -->
    <circle cx="0" cy="0" r="5" fill="#2563EB" />
    <!-- 大骨 -->
    <line x1="0" y1="0" x2="-80" y2="-160" stroke="#2563EB" stroke-width="3" />
    <!-- ラベル -->
    <g transform="translate(-130, -190)">
      <rect width="100" height="36" rx="18" fill="#2563EB" filter="url(#shadow)"/>
      <text x="50" y="24" font-family="sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">人材</text>
    </g>
    
    <!-- 小骨 1 -->
    <line x1="-30" y1="-60" x2="-120" y2="-60" stroke="#60A5FA" stroke-width="2" marker-end="url(#arrowhead-sub)"/>
    <text x="-125" y="-55" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="end" font-weight="500">スキル不足</text>
    
    <!-- 小骨 2 -->
    <line x1="-60" y1="-120" x2="-150" y2="-120" stroke="#60A5FA" stroke-width="2" marker-end="url(#arrowhead-sub)"/>
    <text x="-155" y="-115" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="end" font-weight="500">経験・教育不足</text>
  </g>

  <!-- Category 2: 機械 (Machine) -->
  <g transform="translate(420, 300)">
    <circle cx="0" cy="0" r="5" fill="#D97706" />
    <!-- 大骨 -->
    <line x1="0" y1="0" x2="-80" y2="-160" stroke="#D97706" stroke-width="3" />
    <!-- ラベル -->
    <g transform="translate(-130, -190)">
      <rect width="100" height="36" rx="18" fill="#D97706" filter="url(#shadow)"/>
      <text x="50" y="24" font-family="sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">機械</text>
    </g>
    
    <!-- 小骨 1 -->
    <line x1="-30" y1="-60" x2="-120" y2="-60" stroke="#FBBF24" stroke-width="2" marker-end="url(#arrowhead-sub)"/>
    <text x="-125" y="-55" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="end" font-weight="500">故障頻発</text>
    
    <!-- 小骨 2 -->
    <line x1="-60" y1="-120" x2="-150" y2="-120" stroke="#FBBF24" stroke-width="2" marker-end="url(#arrowhead-sub)"/>
    <text x="-155" y="-115" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="end" font-weight="500">メンテ不足</text>
  </g>

  <!-- Category 3: 測定 (Measurement) -->
  <g transform="translate(640, 300)">
    <circle cx="0" cy="0" r="5" fill="#4F46E5" />
    <!-- 大骨 -->
    <line x1="0" y1="0" x2="-80" y2="-160" stroke="#4F46E5" stroke-width="3" />
    <!-- ラベル -->
    <g transform="translate(-130, -190)">
      <rect width="100" height="36" rx="18" fill="#4F46E5" filter="url(#shadow)"/>
      <text x="50" y="24" font-family="sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">測定</text>
    </g>
    
    <!-- 小骨 1 -->
    <line x1="-30" y1="-60" x2="-120" y2="-60" stroke="#818CF8" stroke-width="2" marker-end="url(#arrowhead-sub)"/>
    <text x="-125" y="-55" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="end" font-weight="500">測定誤差</text>
    
    <!-- 小骨 2 -->
    <line x1="-60" y1="-120" x2="-150" y2="-120" stroke="#818CF8" stroke-width="2" marker-end="url(#arrowhead-sub)"/>
    <text x="-155" y="-115" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="end" font-weight="500">基準・計器不良</text>
  </g>

  <!-- ========================================== -->
  <!-- 下側の枝 (Bottom Branches) -->
  <!-- ========================================== -->

  <!-- Category 4: 方法 (Method) -->
  <g transform="translate(200, 300)">
    <circle cx="0" cy="0" r="5" fill="#7C3AED" />
    <!-- 大骨 -->
    <line x1="0" y1="0" x2="-80" y2="160" stroke="#7C3AED" stroke-width="3" />
    <!-- ラベル -->
    <g transform="translate(-130, 160)">
      <rect width="100" height="36" rx="18" fill="#7C3AED" filter="url(#shadow)"/>
      <text x="50" y="24" font-family="sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">方法</text>
    </g>
    
    <!-- 小骨 1 -->
    <line x1="-30" y1="60" x2="-120" y2="60" stroke="#A78BFA" stroke-width="2" marker-end="url(#arrowhead-sub)"/>
    <text x="-125" y="65" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="end" font-weight="500">プロセス不備</text>
    
    <!-- 小骨 2 -->
    <line x1="-60" y1="120" x2="-150" y2="120" stroke="#A78BFA" stroke-width="2" marker-end="url(#arrowhead-sub)"/>
    <text x="-155" y="125" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="end" font-weight="500">標準化不足</text>
  </g>

  <!-- Category 5: 材料 (Material) -->
  <g transform="translate(420, 300)">
    <circle cx="0" cy="0" r="5" fill="#059669" />
    <!-- 大骨 -->
    <line x1="0" y1="0" x2="-80" y2="160" stroke="#059669" stroke-width="3" />
    <!-- ラベル -->
    <g transform="translate(-130, 160)">
      <rect width="100" height="36" rx="18" fill="#059669" filter="url(#shadow)"/>
      <text x="50" y="24" font-family="sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">材料</text>
    </g>
    
    <!-- 小骨 1 -->
    <line x1="-30" y1="60" x2="-120" y2="60" stroke="#34D399" stroke-width="2" marker-end="url(#arrowhead-sub)"/>
    <text x="-125" y="65" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="end" font-weight="500">品質不良</text>
    
    <!-- 小骨 2 -->
    <line x1="-60" y1="120" x2="-150" y2="120" stroke="#34D399" stroke-width="2" marker-end="url(#arrowhead-sub)"/>
    <text x="-155" y="125" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="end" font-weight="500">仕様不一致</text>
  </g>

  <!-- Category 6: 環境 (Environment) -->
  <g transform="translate(640, 300)">
    <circle cx="0" cy="0" r="5" fill="#E11D48" />
    <!-- 大骨 -->
    <line x1="0" y1="0" x2="-80" y2="160" stroke="#E11D48" stroke-width="3" />
    <!-- ラベル -->
    <g transform="translate(-130, 160)">
      <rect width="100" height="36" rx="18" fill="#E11D48" filter="url(#shadow)"/>
      <text x="50" y="24" font-family="sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">環境</text>
    </g>
    
    <!-- 小骨 1 -->
    <line x1="-30" y1="60" x2="-120" y2="60" stroke="#FB7185" stroke-width="2" marker-end="url(#arrowhead-sub)"/>
    <text x="-125" y="65" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="end" font-weight="500">作業環境不良</text>
    
    <!-- 小骨 2 -->
    <line x1="-60" y1="120" x2="-150" y2="120" stroke="#FB7185" stroke-width="2" marker-end="url(#arrowhead-sub)"/>
    <text x="-155" y="125" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="end" font-weight="500">照明・温度</text>
  </g>

</svg>