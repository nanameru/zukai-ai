<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1F2937" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1F2937">フィッシュボーン図（原因分析）</text>
  
  <!-- Main spine -->
  <line x1="100" y1="300" x2="700" y2="300" stroke="#1F2937" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Problem statement -->
  <rect x="700" y="270" width="80" height="60" rx="5" fill="#EF4444" stroke="#DC2626" stroke-width="2"/>
  <text x="740" y="295" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">問題</text>
  <text x="740" y="315" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">品質低下</text>
  
  <!-- Category 1: 人材 -->
  <line x1="200" y1="300" x2="150" y2="150" stroke="#3B82F6" stroke-width="2"/>
  <text x="100" y="140" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E40AF">人材</text>
  
  <line x1="150" y1="150" x2="100" y2="150" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="50" y="145" font-family="Arial, sans-serif" font-size="11" fill="#374151">スキル不足</text>
  
  <line x1="150" y1="150" x2="150" y2="120" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="150" y="110" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#374151">経験不足</text>
  
  <line x1="150" y1="150" x2="200" y2="150" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="220" y="145" font-family="Arial, sans-serif" font-size="11" fill="#374151">教育不足</text>
  
  <!-- Category 2: 方法 -->
  <line x1="300" y1="300" x2="250" y2="200" stroke="#8B5CF6" stroke-width="2"/>
  <text x="200" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#5B21B6">方法</text>
  
  <line x1="250" y1="200" x2="200" y2="200" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="170" y="195" font-family="Arial, sans-serif" font-size="11" fill="#374151">プロセス未整備</text>
  
  <line x1="250" y1="200" x2="250" y2="170" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="250" y="160" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#374151">標準化不足</text>
  
  <line x1="250" y1="200" x2="300" y2="200" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="320" y="195" font-family="Arial, sans-serif" font-size="11" fill="#374151">手順不明確</text>
  
  <!-- Category 3: 材料 -->
  <line x1="400" y1="300" x2="350" y2="400" stroke="#10B981" stroke-width="2"/>
  <text x="300" y="410" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#065F46">材料</text>
  
  <line x1="350" y1="400" x2="300" y2="400" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="270" y="395" font-family="Arial, sans-serif" font-size="11" fill="#374151">品質不良</text>
  
  <line x1="350" y1="400" x2="350" y2="430" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="350" y="445" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#374151">仕様不一致</text>
  
  <line x1="350" y1="400" x2="400" y2="400" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="420" y="395" font-family="Arial, sans-serif" font-size="11" fill="#374151">在庫不足</text>
  
  <!-- Category 4: 機械 -->
  <line x1="500" y1="300" x2="450" y2="200" stroke="#F59E0B" stroke-width="2"/>
  <text x="400" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400E">機械</text>
  
  <line x1="450" y1="200" x2="400" y2="200" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="370" y="195" font-family="Arial, sans-serif" font-size="11" fill="#374151">故障頻発</text>
  
  <line x1="450" y1="200" x2="450" y2="170" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="450" y="160" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#374151">メンテ不足</text>
  
  <line x1="450" y1="200" x2="500" y2="200" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="520" y="195" font-family="Arial, sans-serif" font-size="11" fill="#374151">性能不足</text>
  
  <!-- Category 5: 環境 -->
  <line x1="600" y1="300" x2="550" y2="400" stroke="#EF4444" stroke-width="2"/>
  <text x="500" y="410" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#991B1B">環境</text>
  
  <line x1="550" y1="400" x2="500" y2="400" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="470" y="395" font-family="Arial, sans-serif" font-size="11" fill="#374151">作業環境不良</text>
  
  <line x1="550" y1="400" x2="550" y2="430" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="550" y="445" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#374151">温度管理</text>
  
  <line x1="550" y1="400" x2="600" y2="400" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="620" y="395" font-family="Arial, sans-serif" font-size="11" fill="#374151">照明不足</text>
  
  <!-- Category 6: 測定 -->
  <line x1="400" y1="300" x2="350" y2="100" stroke="#6366F1" stroke-width="2"/>
  <text x="300" y="90" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4F46E5">測定</text>
  
  <line x1="350" y1="100" x2="300" y2="100" stroke="#6366F1" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="270" y="95" font-family="Arial, sans-serif" font-size="11" fill="#374151">測定誤差</text>
  
  <line x1="350" y1="100" x2="350" y2="70" stroke="#6366F1" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="350" y="60" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#374151">基準不明確</text>
  
  <line x1="350" y1="100" x2="400" y2="100" stroke="#6366F1" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="420" y="95" font-family="Arial, sans-serif" font-size="11" fill="#374151">計器不良</text>
</svg>
