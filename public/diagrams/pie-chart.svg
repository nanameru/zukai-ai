<svg width="500" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pieGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pieGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pieGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pieGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pieGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Pie chart slices -->
  <!-- Slice 1: 35% -->
  <path d="M 200 200 L 200 100 A 100 100 0 0 1 270.71 129.29 Z" fill="url(#pieGrad1)" stroke="white" stroke-width="2"/>
  
  <!-- Slice 2: 25% -->
  <path d="M 200 200 L 270.71 129.29 A 100 100 0 0 1 300 200 Z" fill="url(#pieGrad2)" stroke="white" stroke-width="2"/>
  
  <!-- Slice 3: 20% -->
  <path d="M 200 200 L 300 200 A 100 100 0 0 1 270.71 270.71 Z" fill="url(#pieGrad3)" stroke="white" stroke-width="2"/>
  
  <!-- Slice 4: 15% -->
  <path d="M 200 200 L 270.71 270.71 A 100 100 0 0 1 200 300 Z" fill="url(#pieGrad4)" stroke="white" stroke-width="2"/>
  
  <!-- Slice 5: 5% -->
  <path d="M 200 200 L 200 300 A 100 100 0 0 1 129.29 270.71 Z" fill="url(#pieGrad5)" stroke="white" stroke-width="2"/>
  
  <!-- Center circle -->
  <circle cx="200" cy="200" r="60" fill="white" stroke="#E5E7EB" stroke-width="2"/>
  <text x="200" y="195" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="14" font-weight="bold">合計</text>
  <text x="200" y="210" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="14" font-weight="bold">100%</text>
  
  <!-- Legend -->
  <rect x="320" y="80" width="20" height="20" fill="url(#pieGrad1)"/>
  <text x="350" y="95" fill="#1F2937" font-family="Arial, sans-serif" font-size="12">営業 (35%)</text>
  
  <rect x="320" y="120" width="20" height="20" fill="url(#pieGrad2)"/>
  <text x="350" y="135" fill="#1F2937" font-family="Arial, sans-serif" font-size="12">マーケティング (25%)</text>
  
  <rect x="320" y="160" width="20" height="20" fill="url(#pieGrad3)"/>
  <text x="350" y="175" fill="#1F2937" font-family="Arial, sans-serif" font-size="12">開発 (20%)</text>
  
  <rect x="320" y="200" width="20" height="20" fill="url(#pieGrad4)"/>
  <text x="350" y="215" fill="#1F2937" font-family="Arial, sans-serif" font-size="12">サポート (15%)</text>
  
  <rect x="320" y="240" width="20" height="20" fill="url(#pieGrad5)"/>
  <text x="350" y="255" fill="#1F2937" font-family="Arial, sans-serif" font-size="12">その他 (5%)</text>
  
  <!-- Title -->
  <text x="250" y="30" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="16" font-weight="bold">部門別予算配分</text>
</svg>
