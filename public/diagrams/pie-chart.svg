<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="300" y="40" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1F2937">円グラフ</text>

  <!-- Chart Group -->
  <g transform="translate(-20, 20)">
    <!-- Slice 1: 35% -->
    <path d="M 300 200 L 300 80 A 120 120 0 0 1 397.08 270.44 L 300 200 Z" fill="#3B82F6" stroke="white" stroke-width="2"/>
    <text x="385" y="157" font-family="sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">35%</text>

    <!-- Slice 2: 25% -->
    <path d="M 300 200 L 397.08 270.44 A 120 120 0 0 1 229.56 297.08 L 300 200 Z" fill="#8B5CF6" stroke="white" stroke-width="2"/>
    <text x="315" y="294" font-family="sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">25%</text>

    <!-- Slice 3: 20% -->
    <path d="M 300 200 L 229.56 297.08 A 120 120 0 0 1 185.88 162.92 L 300 200 Z" fill="#10B981" stroke="white" stroke-width="2"/>
    <text x="210" y="229" font-family="sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">20%</text>

    <!-- Slice 4: 15% -->
    <path d="M 300 200 L 185.88 162.92 A 120 120 0 0 1 262.92 85.88 L 300 200 Z" fill="#F59E0B" stroke="white" stroke-width="2"/>
    <text x="233" y="133" font-family="sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">15%</text>

    <!-- Slice 5: 5% -->
    <path d="M 300 200 L 262.92 85.88 A 120 120 0 0 1 300 80 L 300 200 Z" fill="#EF4444" stroke="white" stroke-width="2"/>
    <text x="285" y="106" font-family="sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">5%</text>

    <!-- Donut Hole -->
    <circle cx="300" cy="200" r="70" fill="white"/>
    
    <!-- Center Text -->
    <text x="300" y="195" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#374151">合計</text>
    <text x="300" y="215" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#374151">100%</text>
  </g>

  <!-- Legend -->
  <g transform="translate(440, 140)">
    <circle cx="0" cy="0" r="6" fill="#3B82F6"/>
    <text x="15" y="4" font-family="sans-serif" font-size="12" fill="#4B5563">カテゴリA (35%)</text>
    
    <circle cx="0" cy="25" r="6" fill="#8B5CF6"/>
    <text x="15" y="29" font-family="sans-serif" font-size="12" fill="#4B5563">カテゴリB (25%)</text>
    
    <circle cx="0" cy="50" r="6" fill="#10B981"/>
    <text x="15" y="54" font-family="sans-serif" font-size="12" fill="#4B5563">カテゴリC (20%)</text>
    
    <circle cx="0" cy="75" r="6" fill="#F59E0B"/>
    <text x="15" y="79" font-family="sans-serif" font-size="12" fill="#4B5563">カテゴリD (15%)</text>
    
    <circle cx="0" cy="100" r="6" fill="#EF4444"/>
    <text x="15" y="104" font-family="sans-serif" font-size="12" fill="#4B5563">カテゴリE (5%)</text>
  </g>
