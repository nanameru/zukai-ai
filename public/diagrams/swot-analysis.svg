<svg width="600" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradStrengths" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="gradWeaknesses" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="gradOpportunities" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="gradThreats" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  
  <!-- Grid lines -->
  <line x1="300" y1="50" x2="300" y2="550" stroke="#6B7280" stroke-width="3"/>
  <line x1="50" y1="300" x2="550" y2="300" stroke="#6B7280" stroke-width="3"/>
  
  <!-- Strengths (Top Left) -->
  <rect x="50" y="50" width="250" height="250" fill="url(#gradStrengths)" stroke="#10B981" stroke-width="2"/>
  <text x="175" y="80" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="18" font-weight="bold">強み (Strengths)</text>
  <text x="80" y="110" fill="#065F46" font-family="Arial, sans-serif" font-size="12">• 優れた技術力</text>
  <text x="80" y="135" fill="#065F46" font-family="Arial, sans-serif" font-size="12">• ブランド認知度</text>
  <text x="80" y="160" fill="#065F46" font-family="Arial, sans-serif" font-size="12">• 豊富なリソース</text>
  <text x="80" y="185" fill="#065F46" font-family="Arial, sans-serif" font-size="12">• 優秀な人材</text>
  <text x="80" y="210" fill="#065F46" font-family="Arial, sans-serif" font-size="12">• 市場シェア</text>
  <text x="80" y="235" fill="#065F46" font-family="Arial, sans-serif" font-size="12">• 顧客ロイヤルティ</text>
  <text x="80" y="260" fill="#065F46" font-family="Arial, sans-serif" font-size="12">• 特許・知的財産</text>
  
  <!-- Weaknesses (Top Right) -->
  <rect x="300" y="50" width="250" height="250" fill="url(#gradWeaknesses)" stroke="#EF4444" stroke-width="2"/>
  <text x="425" y="80" text-anchor="middle" fill="#991B1B" font-family="Arial, sans-serif" font-size="18" font-weight="bold">弱み (Weaknesses)</text>
  <text x="330" y="110" fill="#991B1B" font-family="Arial, sans-serif" font-size="12">• 限られた予算</text>
  <text x="330" y="135" fill="#991B1B" font-family="Arial, sans-serif" font-size="12">• 技術的負債</text>
  <text x="330" y="160" fill="#991B1B" font-family="Arial, sans-serif" font-size="12">• 人材不足</text>
  <text x="330" y="185" fill="#991B1B" font-family="Arial, sans-serif" font-size="12">• 市場シェア低</text>
  <text x="330" y="210" fill="#991B1B" font-family="Arial, sans-serif" font-size="12">• ブランド力弱</text>
  <text x="330" y="235" fill="#991B1B" font-family="Arial, sans-serif" font-size="12">• 古いシステム</text>
  <text x="330" y="260" fill="#991B1B" font-family="Arial, sans-serif" font-size="12">• 組織的課題</text>
  
  <!-- Opportunities (Bottom Left) -->
  <rect x="50" y="300" width="250" height="250" fill="url(#gradOpportunities)" stroke="#3B82F6" stroke-width="2"/>
  <text x="175" y="330" text-anchor="middle" fill="#1E40AF" font-family="Arial, sans-serif" font-size="18" font-weight="bold">機会 (Opportunities)</text>
  <text x="80" y="360" fill="#1E40AF" font-family="Arial, sans-serif" font-size="12">• 新市場参入</text>
  <text x="80" y="385" fill="#1E40AF" font-family="Arial, sans-serif" font-size="12">• 技術革新</text>
  <text x="80" y="410" fill="#1E40AF" font-family="Arial, sans-serif" font-size="12">• パートナーシップ</text>
  <text x="80" y="435" fill="#1E40AF" font-family="Arial, sans-serif" font-size="12">• 規制緩和</text>
  <text x="80" y="460" fill="#1E40AF" font-family="Arial, sans-serif" font-size="12">• 顧客ニーズ変化</text>
  <text x="80" y="485" fill="#1E40AF" font-family="Arial, sans-serif" font-size="12">• オンライン化</text>
  <text x="80" y="510" fill="#1E40AF" font-family="Arial, sans-serif" font-size="12">• グローバル展開</text>
  
  <!-- Threats (Bottom Right) -->
  <rect x="300" y="300" width="250" height="250" fill="url(#gradThreats)" stroke="#F59E0B" stroke-width="2"/>
  <text x="425" y="330" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="18" font-weight="bold">脅威 (Threats)</text>
  <text x="330" y="360" fill="#92400E" font-family="Arial, sans-serif" font-size="12">• 競合の参入</text>
  <text x="330" y="385" fill="#92400E" font-family="Arial, sans-serif" font-size="12">• 市場縮小</text>
  <text x="330" y="410" fill="#92400E" font-family="Arial, sans-serif" font-size="12">• 規制強化</text>
  <text x="330" y="435" fill="#92400E" font-family="Arial, sans-serif" font-size="12">• 技術変化</text>
  <text x="330" y="460" fill="#92400E" font-family="Arial, sans-serif" font-size="12">• 経済不況</text>
  <text x="330" y="485" fill="#92400E" font-family="Arial, sans-serif" font-size="12">• 顧客離れ</text>
  <text x="330" y="510" fill="#92400E" font-family="Arial, sans-serif" font-size="12">• サプライチェーン</text>
  
  <!-- Labels -->
  <text x="175" y="35" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14" font-weight="bold">内部要因</text>
  <text x="425" y="35" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14" font-weight="bold">内部要因</text>
  <text x="25" y="175" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14" font-weight="bold">ポジティブ</text>
  <text x="25" y="425" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14" font-weight="bold">ネガティブ</text>
</svg>
