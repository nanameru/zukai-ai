<svg width="600" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Grid lines -->
  <line x1="300" y1="80" x2="300" y2="420" stroke="#6B7280" stroke-width="3"/>
  <line x1="80" y1="250" x2="520" y2="250" stroke="#6B7280" stroke-width="3"/>
  
  <!-- Strengths (Top Left) -->
  <rect x="80" y="80" width="220" height="170" rx="8" fill="#10B981" fill-opacity="0.2" stroke="#059669" stroke-width="2"/>
  <text x="190" y="110" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="18" font-weight="bold">強み</text>
  <text x="190" y="130" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="14">Strengths</text>
  
  <circle cx="110" cy="160" r="4" fill="#059669"/>
  <text x="130" y="165" fill="#065F46" font-family="Arial, sans-serif" font-size="12">ブランド力</text>
  
  <circle cx="110" cy="190" r="4" fill="#059669"/>
  <text x="130" y="195" fill="#065F46" font-family="Arial, sans-serif" font-size="12">技術力</text>
  
  <circle cx="110" cy="220" r="4" fill="#059669"/>
  <text x="130" y="225" fill="#065F46" font-family="Arial, sans-serif" font-size="12">市場シェア</text>
  
  <!-- Weaknesses (Bottom Left) -->
  <rect x="80" y="250" width="220" height="170" rx="8" fill="#EF4444" fill-opacity="0.2" stroke="#DC2626" stroke-width="2"/>
  <text x="190" y="280" text-anchor="middle" fill="#991B1B" font-family="Arial, sans-serif" font-size="18" font-weight="bold">弱み</text>
  <text x="190" y="300" text-anchor="middle" fill="#991B1B" font-family="Arial, sans-serif" font-size="14">Weaknesses</text>
  
  <circle cx="110" cy="330" r="4" fill="#DC2626"/>
  <text x="130" y="335" fill="#991B1B" font-family="Arial, sans-serif" font-size="12">リソース不足</text>
  
  <circle cx="110" cy="360" r="4" fill="#DC2626"/>
  <text x="130" y="365" fill="#991B1B" font-family="Arial, sans-serif" font-size="12">技術的負債</text>
  
  <circle cx="110" cy="390" r="4" fill="#DC2626"/>
  <text x="130" y="395" fill="#991B1B" font-family="Arial, sans-serif" font-size="12">人材不足</text>
  
  <!-- Opportunities (Top Right) -->
  <rect x="300" y="80" width="220" height="170" rx="8" fill="#3B82F6" fill-opacity="0.2" stroke="#2563EB" stroke-width="2"/>
  <text x="410" y="110" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="18" font-weight="bold">機会</text>
  <text x="410" y="130" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="14">Opportunities</text>
  
  <circle cx="330" cy="160" r="4" fill="#2563EB"/>
  <text x="350" y="165" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="12">新市場開拓</text>
  
  <circle cx="330" cy="190" r="4" fill="#2563EB"/>
  <text x="350" y="195" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="12">技術革新</text>
  
  <circle cx="330" cy="220" r="4" fill="#2563EB"/>
  <text x="350" y="225" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="12">パートナーシップ</text>
  
  <!-- Threats (Bottom Right) -->
  <rect x="300" y="250" width="220" height="170" rx="8" fill="#F59E0B" fill-opacity="0.2" stroke="#D97706" stroke-width="2"/>
  <text x="410" y="280" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="18" font-weight="bold">脅威</text>
  <text x="410" y="300" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="14">Threats</text>
  
  <circle cx="330" cy="330" r="4" fill="#D97706"/>
  <text x="350" y="335" fill="#92400E" font-family="Arial, sans-serif" font-size="12">競合参入</text>
  
  <circle cx="330" cy="360" r="4" fill="#D97706"/>
  <text x="350" y="365" fill="#92400E" font-family="Arial, sans-serif" font-size="12">市場変化</text>
  
  <circle cx="330" cy="390" r="4" fill="#D97706"/>
  <text x="350" y="395" fill="#92400E" font-family="Arial, sans-serif" font-size="12">規制強化</text>
  
  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="18" font-weight="bold">SWOT分析</text>
  
  <!-- Axis labels -->
  <text x="190" y="70" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="14" font-weight="bold">内部要因</text>
  <text x="410" y="70" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="14" font-weight="bold">外部要因</text>
  
  <text x="30" y="250" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="14" font-weight="bold" transform="rotate(-90 30 250)">ポジティブ</text>
  <text x="30" y="250" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="14" font-weight="bold" transform="rotate(-90 30 250) translate(0, 200)">ネガティブ</text>
</svg>
