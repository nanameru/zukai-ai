<svg width="500" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="quad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="quad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="quad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="quad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Grid lines -->
  <line x1="250" y1="80" x2="250" y2="420" stroke="#6B7280" stroke-width="3"/>
  <line x1="80" y1="250" x2="420" y2="250" stroke="#6B7280" stroke-width="3"/>
  
  <!-- Quadrant 1: High Impact, High Effort -->
  <rect x="80" y="80" width="170" height="170" fill="url(#quad1)" stroke="#10B981" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="165" y="130" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="14" font-weight="bold">高影響</text>
  <text x="165" y="150" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="14" font-weight="bold">高工数</text>
  <text x="165" y="180" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="11">戦略的</text>
  <text x="165" y="200" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="11">プロジェクト</text>
  <text x="165" y="220" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="10">計画して実行</text>
  
  <!-- Quadrant 2: High Impact, Low Effort -->
  <rect x="250" y="80" width="170" height="170" fill="url(#quad2)" stroke="#F59E0B" stroke-width="2"/>
  <text x="335" y="130" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="14" font-weight="bold">高影響</text>
  <text x="335" y="150" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="14" font-weight="bold">低工数</text>
  <text x="335" y="180" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="11">クイック</text>
  <text x="335" y="200" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="11">ウィン</text>
  <text x="335" y="220" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="10">優先的に実行</text>
  
  <!-- Quadrant 3: Low Impact, Low Effort -->
  <rect x="80" y="250" width="170" height="170" fill="url(#quad3)" stroke="#EF4444" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="165" y="300" text-anchor="middle" fill="#991B1B" font-family="Arial, sans-serif" font-size="14" font-weight="bold">低影響</text>
  <text x="165" y="320" text-anchor="middle" fill="#991B1B" font-family="Arial, sans-serif" font-size="14" font-weight="bold">低工数</text>
  <text x="165" y="350" text-anchor="middle" fill="#991B1B" font-family="Arial, sans-serif" font-size="11">埋め込み</text>
  <text x="165" y="370" text-anchor="middle" fill="#991B1B" font-family="Arial, sans-serif" font-size="11">タスク</text>
  <text x="165" y="390" text-anchor="middle" fill="#991B1B" font-family="Arial, sans-serif" font-size="10">時間がある時</text>
  
  <!-- Quadrant 4: Low Impact, High Effort -->
  <rect x="250" y="250" width="170" height="170" fill="url(#quad4)" stroke="#6366F1" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="335" y="300" text-anchor="middle" fill="#312E81" font-family="Arial, sans-serif" font-size="14" font-weight="bold">低影響</text>
  <text x="335" y="320" text-anchor="middle" fill="#312E81" font-family="Arial, sans-serif" font-size="14" font-weight="bold">高工数</text>
  <text x="335" y="350" text-anchor="middle" fill="#312E81" font-family="Arial, sans-serif" font-size="11">時間の</text>
  <text x="335" y="370" text-anchor="middle" fill="#312E81" font-family="Arial, sans-serif" font-size="11">無駄</text>
  <text x="335" y="390" text-anchor="middle" fill="#312E81" font-family="Arial, sans-serif" font-size="10">避けるべき</text>
  
  <!-- Axis labels -->
  <text x="250" y="50" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="16" font-weight="bold">影響度</text>
  <text x="250" y="70" text-anchor="middle" fill="#6B7280" font-family="Arial, sans-serif" font-size="12">高 ← → 低</text>
  
  <text x="30" y="250" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="16" font-weight="bold" transform="rotate(-90 30 250)">工数</text>
  <text x="10" y="250" text-anchor="middle" fill="#6B7280" font-family="Arial, sans-serif" font-size="12" transform="rotate(-90 10 250)">高 ↑ ↓ 低</text>
  
  <!-- Title -->
  <text x="250" y="30" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="18" font-weight="bold">優先順位マトリックス</text>
</svg>
