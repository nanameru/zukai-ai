<svg width="500" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradHigh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="gradLow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Grid lines -->
  <line x1="250" y1="50" x2="250" y2="450" stroke="#6B7280" stroke-width="3"/>
  <line x1="50" y1="250" x2="450" y2="250" stroke="#6B7280" stroke-width="3"/>
  
  <!-- Quadrant 1: High X, High Y -->
  <rect x="250" y="50" width="200" height="200" fill="url(#gradHigh)" stroke="#10B981" stroke-width="2"/>
  <text x="350" y="130" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="14" font-weight="bold">高優先度</text>
  <text x="350" y="150" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="12">高影響</text>
  <circle cx="320" cy="200" r="8" fill="#10B981"/>
  <text x="320" y="225" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11">項目A</text>
  
  <!-- Quadrant 2: Low X, High Y -->
  <rect x="50" y="50" width="200" height="200" fill="url(#gradLow)" stroke="#F59E0B" stroke-width="2"/>
  <text x="150" y="130" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="14" font-weight="bold">低優先度</text>
  <text x="150" y="150" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="12">高影響</text>
  <circle cx="180" cy="200" r="8" fill="#F59E0B"/>
  <text x="180" y="225" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11">項目B</text>
  
  <!-- Quadrant 3: Low X, Low Y -->
  <rect x="50" y="250" width="200" height="200" fill="url(#gradLow)" stroke="#F59E0B" stroke-width="2"/>
  <text x="150" y="330" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="14" font-weight="bold">低優先度</text>
  <text x="150" y="350" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="12">低影響</text>
  <circle cx="180" cy="300" r="8" fill="#F59E0B"/>
  <text x="180" y="325" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11">項目C</text>
  
  <!-- Quadrant 4: High X, Low Y -->
  <rect x="250" y="250" width="200" height="200" fill="url(#gradHigh)" stroke="#10B981" stroke-width="2"/>
  <text x="350" y="330" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="14" font-weight="bold">高優先度</text>
  <text x="350" y="350" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="12">低影響</text>
  <circle cx="320" cy="300" r="8" fill="#10B981"/>
  <text x="320" y="325" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11">項目D</text>
  
  <!-- Axis labels -->
  <text x="350" y="35" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14" font-weight="bold">高影響</text>
  <text x="150" y="35" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14" font-weight="bold">高影響</text>
  <text x="350" y="470" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14" font-weight="bold">低影響</text>
  <text x="150" y="470" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14" font-weight="bold">低影響</text>
  
  <text x="25" y="150" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14" font-weight="bold">低</text>
  <text x="25" y="250" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14" font-weight="bold">優先度</text>
  <text x="25" y="350" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14" font-weight="bold">高</text>
  
  <text x="475" y="150" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14" font-weight="bold">高</text>
  <text x="475" y="250" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14" font-weight="bold">優先度</text>
  <text x="475" y="350" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14" font-weight="bold">低</text>
</svg>
