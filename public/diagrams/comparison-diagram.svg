<svg width="700" height="500" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Modern Soft Drop Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
    
    <!-- Gradients (Subtle) -->
    <linearGradient id="headerGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" /> <!-- Blue-500 -->
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" /> <!-- Blue-600 -->
    </linearGradient>
    <linearGradient id="headerGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" /> <!-- Red-500 -->
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" /> <!-- Red-600 -->
    </linearGradient>
  </defs>

  <!-- Background (Transparent, but helpful for context if needed) -->
  <!-- <rect width="100%" height="100%" fill="#F9FAFB"/> -->

  <!-- Main Title -->
  <text x="350" y="50" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1F2937">比較検討 (プランA vs プランB)</text>

  <!-- Card A -->
  <g transform="translate(50, 90)">
    <!-- Card Bg -->
    <rect x="0" y="0" width="280" height="380" rx="16" fill="#FFFFFF" filter="url(#softShadow)"/>
    
    <!-- Header Stripe -->
    <path d="M0,16 Q0,0 16,0 L264,0 Q280,0 280,16 L280,70 L0,70 Z" fill="url(#headerGradA)"/>
    <text x="140" y="45" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#FFFFFF">プラン A</text>
    
    <!-- Content Container -->
    <g transform="translate(20, 100)">
      <!-- Pros -->
      <text x="0" y="0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#3B82F6" letter-spacing="1">MERITS</text>
      
      <g transform="translate(0, 20)">
        <circle cx="8" cy="8" r="10" fill="#EFF6FF"/>
        <path d="M5 8 L8 11 L12 5" stroke="#3B82F6" stroke-width="2" fill="none"/>
        <text x="26" y="13" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#374151">初期コストが低い</text>
      </g>
      <g transform="translate(0, 55)">
        <circle cx="8" cy="8" r="10" fill="#EFF6FF"/>
        <path d="M5 8 L8 11 L12 5" stroke="#3B82F6" stroke-width="2" fill="none"/>
        <text x="26" y="13" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#374151">導入までの期間が短い</text>
      </g>

      <!-- Divider -->
      <line x1="0" y1="100" x2="240" y2="100" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 4"/>

      <!-- Cons -->
      <text x="0" y="130" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#6B7280" letter-spacing="1">DEMERITS</text>

      <g transform="translate(0, 150)">
        <circle cx="8" cy="8" r="10" fill="#F3F4F6"/>
        <path d="M5 8 L11 8" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
        <text x="26" y="13" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#4B5563">機能が限定的</text>
      </g>
      <g transform="translate(0, 185)">
        <circle cx="8" cy="8" r="10" fill="#F3F4F6"/>
        <path d="M5 8 L11 8" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
        <text x="26" y="13" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#4B5563">将来的な拡張性が低い</text>
      </g>
    </g>
  </g>

  <!-- Card B -->
  <g transform="translate(370, 90)">
    <!-- Card Bg -->
    <rect x="0" y="0" width="280" height="380" rx="16" fill="#FFFFFF" filter="url(#softShadow)"/>
    
    <!-- Header Stripe -->
    <path d="M0,16 Q0,0 16,0 L264,0 Q280,0 280,16 L280,70 L0,70 Z" fill="url(#headerGradB)"/>
    <text x="140" y="45" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#FFFFFF">プラン B</text>
    
    <!-- Content Container -->
    <g transform="translate(20, 100)">
      <!-- Pros -->
      <text x="0" y="0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#EF4444" letter-spacing="1">MERITS</text>
      
      <g transform="translate(0, 20)">
        <circle cx="8" cy="8" r="10" fill="#FEF2F2"/>
        <path d="M5 8 L8 11 L12 5" stroke="#EF4444" stroke-width="2" fill="none"/>
        <text x="26" y="13" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#374151">高機能で多用途に対応</text>
      </g>
      <g transform="translate(0, 55)">
        <circle cx="8" cy="8" r="10" fill="#FEF2F2"/>
        <path d="M5 8 L8 11 L12 5" stroke="#EF4444" stroke-width="2" fill="none"/>
        <text x="26" y="13" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#374151">長期的なROIが高い</text>
      </g>

      <!-- Divider -->
      <line x1="0" y1="100" x2="240" y2="100" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 4"/>

      <!-- Cons -->
      <text x="0" y="130" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#6B7280" letter-spacing="1">DEMERITS</text>

      <g transform="translate(0, 150)">
        <circle cx="8" cy="8" r="10" fill="#F3F4F6"/>
        <path d="M5 8 L11 8" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
        <text x="26" y="13" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#4B5563">初期費用が高い</text>
      </g>
      <g transform="translate(0, 185)">
        <circle cx="8" cy="8" r="10" fill="#F3F4F6"/>
        <path d="M5 8 L11 8" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
        <text x="26" y="13" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#4B5563">導入期間が長い</text>
      </g>
    </g>
  </g>

  <!-- VS Badge (Floating Center) -->
  <g transform="translate(350, 280)">
    <circle cx="0" cy="0" r="28" fill="#FFFFFF" filter="url(#softShadow)"/>
    <circle cx="0" cy="0" r="24" fill="#1F2937"/> <!-- Dark Gray -->
    <text x="0" y="8" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">VS</text>
  </g>

</svg>