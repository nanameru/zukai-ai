<svg width="700" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="350" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1F2937">組織図</text>
  
  <!-- CEO -->
  <rect x="300" y="60" width="100" height="60" rx="5" fill="url(#orgGrad)" stroke="#333" stroke-width="2"/>
  <text x="350" y="85" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">CEO</text>
  <text x="350" y="105" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">代表取締役</text>
  
  <!-- Lines to managers -->
  <line x1="350" y1="120" x2="350" y2="160" stroke="#6366F1" stroke-width="2"/>
  <line x1="150" y1="160" x2="550" y2="160" stroke="#6366F1" stroke-width="2"/>
  <line x1="150" y1="160" x2="150" y2="200" stroke="#6366F1" stroke-width="2"/>
  <line x1="350" y1="160" x2="350" y2="200" stroke="#6366F1" stroke-width="2"/>
  <line x1="550" y1="160" x2="550" y2="200" stroke="#6366F1" stroke-width="2"/>
  
  <!-- Manager 1 -->
  <rect x="100" y="200" width="100" height="60" rx="5" fill="#E0E7FF" stroke="#6366F1" stroke-width="2"/>
  <text x="150" y="225" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F2937">マネージャー1</text>
  <text x="150" y="245" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#4B5563">営業部</text>
  
  <!-- Manager 2 -->
  <rect x="300" y="200" width="100" height="60" rx="5" fill="#E0E7FF" stroke="#6366F1" stroke-width="2"/>
  <text x="350" y="225" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F2937">マネージャー2</text>
  <text x="350" y="245" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#4B5563">開発部</text>
  
  <!-- Manager 3 -->
  <rect x="500" y="200" width="100" height="60" rx="5" fill="#E0E7FF" stroke="#6366F1" stroke-width="2"/>
  <text x="550" y="225" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F2937">マネージャー3</text>
  <text x="550" y="245" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#4B5563">人事部</text>
  
  <!-- Lines to staff -->
  <line x1="150" y1="260" x2="150" y2="300" stroke="#6366F1" stroke-width="2"/>
  <line x1="350" y1="260" x2="350" y2="300" stroke="#6366F1" stroke-width="2"/>
  <line x1="550" y1="260" x2="550" y2="300" stroke="#6366F1" stroke-width="2"/>
  
  <!-- Staff under Manager 1 -->
  <line x1="100" y1="300" x2="200" y2="300" stroke="#6366F1" stroke-width="2"/>
  <line x1="100" y1="300" x2="100" y2="340" stroke="#6366F1" stroke-width="2"/>
  <line x1="150" y1="300" x2="150" y2="340" stroke="#6366F1" stroke-width="2"/>
  <line x1="200" y1="300" x2="200" y2="340" stroke="#6366F1" stroke-width="2"/>
  
  <rect x="70" y="340" width="60" height="50" rx="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1"/>
  <text x="100" y="365" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">スタッフ1</text>
  
  <rect x="120" y="340" width="60" height="50" rx="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1"/>
  <text x="150" y="365" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">スタッフ2</text>
  
  <rect x="170" y="340" width="60" height="50" rx="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1"/>
  <text x="200" y="365" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">スタッフ3</text>
  
  <!-- Staff under Manager 2 -->
  <line x1="300" y1="300" x2="400" y2="300" stroke="#6366F1" stroke-width="2"/>
  <line x1="300" y1="300" x2="300" y2="340" stroke="#6366F1" stroke-width="2"/>
  <line x1="350" y1="300" x2="350" y2="340" stroke="#6366F1" stroke-width="2"/>
  <line x1="400" y1="300" x2="400" y2="340" stroke="#6366F1" stroke-width="2"/>
  
  <rect x="270" y="340" width="60" height="50" rx="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1"/>
  <text x="300" y="365" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">スタッフ4</text>
  
  <rect x="320" y="340" width="60" height="50" rx="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1"/>
  <text x="350" y="365" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">スタッフ5</text>
  
  <rect x="370" y="340" width="60" height="50" rx="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1"/>
  <text x="400" y="365" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">スタッフ6</text>
  
  <!-- Staff under Manager 3 -->
  <line x1="500" y1="300" x2="600" y2="300" stroke="#6366F1" stroke-width="2"/>
  <line x1="500" y1="300" x2="500" y2="340" stroke="#6366F1" stroke-width="2"/>
  <line x1="550" y1="300" x2="550" y2="340" stroke="#6366F1" stroke-width="2"/>
  <line x1="600" y1="300" x2="600" y2="340" stroke="#6366F1" stroke-width="2"/>
  
  <rect x="470" y="340" width="60" height="50" rx="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1"/>
  <text x="500" y="365" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">スタッフ7</text>
  
  <rect x="520" y="340" width="60" height="50" rx="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1"/>
  <text x="550" y="365" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">スタッフ8</text>
  
  <rect x="570" y="340" width="60" height="50" rx="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1"/>
  <text x="600" y="365" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">スタッフ9</text>
</svg>
