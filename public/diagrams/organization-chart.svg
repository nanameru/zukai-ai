<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- ドロップシャドウ -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
    <!-- グラデーション: CEO -->
    <linearGradient id="gradCEO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
    <!-- グラデーション: Manager -->
    <linearGradient id="gradMgr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>

  <style>
    .text-title { font-family: 'Inter', sans-serif; font-size: 24px; font-weight: bold; fill: #1f2937; }
    .text-role { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: bold; fill: white; }
    .text-sub { font-family: 'Inter', sans-serif; font-size: 12px; fill: rgba(255,255,255,0.9); }
    .text-mgr-role { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: bold; fill: #1f2937; }
    .text-mgr-dept { font-family: 'Inter', sans-serif; font-size: 12px; fill: #6b7280; }
    .text-staff { font-family: 'Inter', sans-serif; font-size: 12px; fill: #374151; }
    .connector { fill: none; stroke: #cbd5e1; stroke-width: 2; }
  </style>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f9fafb" />

  <!-- タイトル -->
  <text x="400" y="40" text-anchor="middle" class="text-title">組織体制図</text>

  <!-- コネクタ（線）の定義 -->
  <!-- CEO to Managers -->
  <path d="M400,130 L400,160" class="connector" />
  <path d="M200,160 L600,160" class="connector" />
  <path d="M200,160 L200,190" class="connector" />
  <path d="M400,160 L400,190" class="connector" />
  <path d="M600,160 L600,190" class="connector" />

  <!-- Manager 1 to Staff -->
  <path d="M200,250 L200,280" class="connector" />
  <path d="M200,280 L200,390" class="connector" />
  <path d="M200,280 L220,280" class="connector" />
  <path d="M200,335 L220,335" class="connector" />
  <path d="M200,390 L220,390" class="connector" />

  <!-- Manager 2 to Staff -->
  <path d="M400,250 L400,280" class="connector" />
  <path d="M400,280 L400,390" class="connector" />
  <path d="M400,280 L420,280" class="connector" />
  <path d="M400,335 L420,335" class="connector" />
  <path d="M400,390 L420,390" class="connector" />

  <!-- Manager 3 to Staff -->
  <path d="M600,250 L600,280" class="connector" />
  <path d="M600,280 L600,390" class="connector" />
  <path d="M600,280 L620,280" class="connector" />
  <path d="M600,335 L620,335" class="connector" />
  <path d="M600,390 L620,390" class="connector" />

  <!-- ノード: CEO -->
  <g filter="url(#shadow)">
    <rect x="320" y="70" width="160" height="60" rx="8" fill="url(#gradCEO)" />
    <text x="400" y="98" text-anchor="middle" class="text-role">CEO</text>
    <text x="400" y="118" text-anchor="middle" class="text-sub">代表取締役</text>
  </g>

  <!-- ノード: Managers -->
  <!-- Manager 1 -->
  <g filter="url(#shadow)">
    <rect x="120" y="190" width="160" height="60" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <path d="M120,190 h160 a6,6 0 0 1 6,6 v54 a6,6 0 0 1 -6,6 h-160 a6,6 0 0 1 -6,-6 v-54 a6,6 0 0 1 6,-6" fill="none" />
    <path d="M120,190 h160 v4 a0,0 0 0 1 0,0 h-160 a0,0 0 0 1 0,0 v-4" fill="#3b82f6" clip-path="inset(0 0 0 0 round 6 6 0 0)" />
    <text x="200" y="218" text-anchor="middle" class="text-mgr-role">営業部長</text>
    <text x="200" y="238" text-anchor="middle" class="text-mgr-dept">Sales Dept.</text>
  </g>

  <!-- Manager 2 -->
  <g filter="url(#shadow)">
    <rect x="320" y="190" width="160" height="60" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <path d="M320,190 h160 v4 h-160 v-4" fill="#10b981" clip-path="inset(0 0 0 0 round 6 6 0 0)" />
    <text x="400" y="218" text-anchor="middle" class="text-mgr-role">開発部長</text>
    <text x="400" y="238" text-anchor="middle" class="text-mgr-dept">R&amp;D Dept.</text>
  </g>

  <!-- Manager 3 -->
  <g filter="url(#shadow)">
    <rect x="520" y="190" width="160" height="60" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <path d="M520,190 h160 v4 h-160 v-4" fill="#f59e0b" clip-path="inset(0 0 0 0 round 6 6 0 0)" />
    <text x="600" y="218" text-anchor="middle" class="text-mgr-role">人事部長</text>
    <text x="600" y="238" text-anchor="middle" class="text-mgr-dept">HR Dept.</text>
  </g>

  <!-- ノード: Staffs (Vertical Lists) -->
  <!-- Group 1 -->
  <g transform="translate(220, 260)">
    <rect x="0" y="0" width="130" height="40" rx="4" fill="white" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)" />
    <text x="65" y="25" text-anchor="middle" class="text-staff">スタッフ A</text>
  </g>
  <g transform="translate(220, 315)">
    <rect x="0" y="0" width="130" height="40" rx="4" fill="white" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)" />
    <text x="65" y="25" text-anchor="middle" class="text-staff">スタッフ B</text>
  </g>
  <g transform="translate(220, 370)">
    <rect x="0" y="0" width="130" height="40" rx="4" fill="white" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)" />
    <text x="65" y="25" text-anchor="middle" class="text-staff">スタッフ C</text>
  </g>

  <!-- Group 2 -->
  <g transform="translate(420, 260)">
    <rect x="0" y="0" width="130" height="40" rx="4" fill="white" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)" />
    <text x="65" y="25" text-anchor="middle" class="text-staff">リードエンジニア</text>
  </g>
  <g transform="translate(420, 315)">
    <rect x="0" y="0" width="130" height="40" rx="4" fill="white" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)" />
    <text x="65" y="25" text-anchor="middle" class="text-staff">エンジニア</text>
  </g>
  <g transform="translate(420, 370)">
    <rect x="0" y="0" width="130" height="40" rx="4" fill="white" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)" />
    <text x="65" y="25" text-anchor="middle" class="text-staff">デザイナー</text>
  </g>

  <!-- Group 3 -->
  <g transform="translate(620, 260)">
    <rect x="0" y="0" width="130" height="40" rx="4" fill="white" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)" />
    <text x="65" y="25" text-anchor="middle" class="text-staff">採用担当</text>
  </g>
  <g transform="translate(620, 315)">
    <rect x="0" y="0" width="130" height="40" rx="4" fill="white" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)" />
    <text x="65" y="25" text-anchor="middle" class="text-staff">労務担当</text>
  </g>
  <g transform="translate(620, 370)">
    <rect x="0" y="0" width="130" height="40" rx="4" fill="white" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)" />
    <text x="65" y="25" text-anchor="middle" class="text-staff">総務担当</text>
  </g>

</svg>