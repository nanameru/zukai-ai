<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- CEO -->
  <rect x="250" y="20" width="100" height="60" rx="8" fill="url(#grad1)" stroke="#312E81" stroke-width="2"/>
  <text x="300" y="45" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">CEO</text>
  <text x="300" y="65" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">経営責任者</text>
  
  <!-- Lines -->
  <line x1="300" y1="80" x2="300" y2="120" stroke="#6366F1" stroke-width="2"/>
  <line x1="300" y1="120" x2="150" y2="120" stroke="#6366F1" stroke-width="2"/>
  <line x1="300" y1="120" x2="450" y2="120" stroke="#6366F1" stroke-width="2"/>
  
  <!-- VP 1 -->
  <rect x="100" y="140" width="100" height="60" rx="8" fill="#6366F1" stroke="#312E81" stroke-width="2"/>
  <text x="150" y="165" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="bold">VP 営業</text>
  <text x="150" y="185" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Sales</text>
  
  <!-- VP 2 -->
  <rect x="400" y="140" width="100" height="60" rx="8" fill="#6366F1" stroke="#312E81" stroke-width="2"/>
  <text x="450" y="165" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="bold">VP 開発</text>
  <text x="450" y="185" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Development</text>
  
  <!-- Lines to managers -->
  <line x1="150" y1="200" x2="150" y2="240" stroke="#818CF8" stroke-width="2"/>
  <line x1="150" y1="240" x2="80" y2="240" stroke="#818CF8" stroke-width="2"/>
  <line x1="150" y1="240" x2="220" y2="240" stroke="#818CF8" stroke-width="2"/>
  
  <line x1="450" y1="200" x2="450" y2="240" stroke="#818CF8" stroke-width="2"/>
  <line x1="450" y1="240" x2="380" y2="240" stroke="#818CF8" stroke-width="2"/>
  <line x1="450" y1="240" x2="520" y2="240" stroke="#818CF8" stroke-width="2"/>
  
  <!-- Managers -->
  <rect x="30" y="260" width="100" height="50" rx="6" fill="#818CF8" stroke="#312E81" stroke-width="1.5"/>
  <text x="80" y="285" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">マネージャー</text>
  <text x="80" y="300" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9">Manager A</text>
  
  <rect x="170" y="260" width="100" height="50" rx="6" fill="#818CF8" stroke="#312E81" stroke-width="1.5"/>
  <text x="220" y="285" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">マネージャー</text>
  <text x="220" y="300" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9">Manager B</text>
  
  <rect x="330" y="260" width="100" height="50" rx="6" fill="#818CF8" stroke="#312E81" stroke-width="1.5"/>
  <text x="380" y="285" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">マネージャー</text>
  <text x="380" y="300" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9">Manager C</text>
  
  <rect x="470" y="260" width="100" height="50" rx="6" fill="#818CF8" stroke="#312E81" stroke-width="1.5"/>
  <text x="520" y="285" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">マネージャー</text>
  <text x="520" y="300" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9">Manager D</text>
</svg>
