<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Y-axis -->
  <line x1="60" y1="40" x2="60" y2="320" stroke="#6B7280" stroke-width="2"/>
  
  <!-- X-axis -->
  <line x1="60" y1="320" x2="560" y2="320" stroke="#6B7280" stroke-width="2"/>
  
  <!-- Y-axis labels -->
  <text x="55" y="45" text-anchor="end" fill="#6B7280" font-family="Arial, sans-serif" font-size="11">100</text>
  <text x="55" y="105" text-anchor="end" fill="#6B7280" font-family="Arial, sans-serif" font-size="11">75</text>
  <text x="55" y="165" text-anchor="end" fill="#6B7280" font-family="Arial, sans-serif" font-size="11">50</text>
  <text x="55" y="225" text-anchor="end" fill="#6B7280" font-family="Arial, sans-serif" font-size="11">25</text>
  <text x="55" y="285" text-anchor="end" fill="#6B7280" font-family="Arial, sans-serif" font-size="11">0</text>
  
  <!-- Grid lines -->
  <line x1="60" y1="105" x2="560" y2="105" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="60" y1="165" x2="560" y2="165" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="60" y1="225" x2="560" y2="225" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="60" y1="285" x2="560" y2="285" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- Bar 1 -->
  <rect x="100" y="200" width="80" height="120" rx="4" fill="url(#barGrad1)"/>
  <text x="140" y="315" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Q1</text>
  <text x="140" y="190" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="12" font-weight="bold">60</text>
  
  <!-- Bar 2 -->
  <rect x="200" y="140" width="80" height="180" rx="4" fill="url(#barGrad2)"/>
  <text x="240" y="325" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Q2</text>
  <text x="240" y="130" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="12" font-weight="bold">90</text>
  
  <!-- Bar 3 -->
  <rect x="300" y="100" width="80" height="220" rx="4" fill="url(#barGrad3)"/>
  <text x="340" y="325" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Q3</text>
  <text x="340" y="90" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="12" font-weight="bold">110</text>
  
  <!-- Bar 4 -->
  <rect x="400" y="80" width="80" height="240" rx="4" fill="url(#barGrad4)"/>
  <text x="440" y="325" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Q4</text>
  <text x="440" y="70" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="12" font-weight="bold">120</text>
  
  <!-- Title -->
  <text x="310" y="25" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="16" font-weight="bold">四半期別売上実績</text>
  
  <!-- Y-axis label -->
  <text x="310" y="370" text-anchor="middle" fill="#6B7280" font-family="Arial, sans-serif" font-size="12">四半期</text>
  
  <!-- Y-axis title -->
  <text x="15" y="180" text-anchor="middle" fill="#6B7280" font-family="Arial, sans-serif" font-size="12" transform="rotate(-90 15 180)">売上 (万円)</text>
</svg>
