<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Y-axis -->
  <line x1="80" y1="50" x2="80" y2="320" stroke="#6B7280" stroke-width="2"/>
  
  <!-- X-axis -->
  <line x1="80" y1="320" x2="550" y2="320" stroke="#6B7280" stroke-width="2"/>
  
  <!-- Y-axis labels -->
  <text x="75" y="55" text-anchor="end" fill="#6B7280" font-family="Arial, sans-serif" font-size="11">100</text>
  <text x="75" y="95" text-anchor="end" fill="#6B7280" font-family="Arial, sans-serif" font-size="11">80</text>
  <text x="75" y="135" text-anchor="end" fill="#6B7280" font-family="Arial, sans-serif" font-size="11">60</text>
  <text x="75" y="175" text-anchor="end" fill="#6B7280" font-family="Arial, sans-serif" font-size="11">40</text>
  <text x="75" y="215" text-anchor="end" fill="#6B7280" font-family="Arial, sans-serif" font-size="11">20</text>
  <text x="75" y="255" text-anchor="end" fill="#6B7280" font-family="Arial, sans-serif" font-size="11">0</text>
  
  <!-- Grid lines -->
  <line x1="80" y1="80" x2="550" y2="80" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="80" y1="120" x2="550" y2="120" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="80" y1="160" x2="550" y2="160" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="80" y1="200" x2="550" y2="200" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="80" y1="240" x2="550" y2="240" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Bars -->
  <!-- Q1: 65 -->
  <rect x="120" y="200" width="60" height="120" fill="url(#barGrad)" rx="4"/>
  <text x="150" y="190" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="12" font-weight="bold">65</text>
  <text x="150" y="340" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="11">Q1</text>
  
  <!-- Q2: 85 -->
  <rect x="220" y="160" width="60" height="160" fill="url(#barGrad)" rx="4"/>
  <text x="250" y="150" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="12" font-weight="bold">85</text>
  <text x="250" y="340" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="11">Q2</text>
  
  <!-- Q3: 75 -->
  <rect x="320" y="180" width="60" height="140" fill="url(#barGrad)" rx="4"/>
  <text x="350" y="170" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="12" font-weight="bold">75</text>
  <text x="350" y="340" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="11">Q3</text>
  
  <!-- Q4: 95 -->
  <rect x="420" y="140" width="60" height="180" fill="url(#barGrad)" rx="4"/>
  <text x="450" y="130" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="12" font-weight="bold">95</text>
  <text x="450" y="340" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="11">Q4</text>
  
  <!-- Title -->
  <text x="315" y="30" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="18" font-weight="bold">四半期別売上実績</text>
  
  <!-- Axis labels -->
  <text x="315" y="365" text-anchor="middle" fill="#6B7280" font-family="Arial, sans-serif" font-size="12">四半期</text>
  <text x="30" y="185" text-anchor="middle" fill="#6B7280" font-family="Arial, sans-serif" font-size="12" transform="rotate(-90 30 185)">売上 (百万円)</text>
</svg>
