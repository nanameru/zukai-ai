<svg width="700" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="350" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1F2937">バーグラフ</text>
  
  <!-- Y-axis label -->
  <text x="30" y="220" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#6B7280" transform="rotate(-90 30 220)">値</text>
  
  <!-- X-axis -->
  <line x1="80" y1="350" x2="650" y2="350" stroke="#9CA3AF" stroke-width="2"/>
  
  <!-- Y-axis -->
  <line x1="80" y1="50" x2="80" y2="350" stroke="#9CA3AF" stroke-width="2"/>
  
  <!-- Y-axis labels -->
  <text x="75" y="355" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#6B7280">0</text>
  <text x="75" y="305" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#6B7280">25</text>
  <text x="75" y="255" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#6B7280">50</text>
  <text x="75" y="205" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#6B7280">75</text>
  <text x="75" y="155" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#6B7280">100</text>
  
  <!-- Grid lines -->
  <line x1="80" y1="300" x2="650" y2="300" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="80" y1="250" x2="650" y2="250" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="80" y1="200" x2="650" y2="200" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="80" y1="150" x2="650" y2="150" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Bar 1: 80 -->
  <rect x="120" y="190" width="80" height="160" fill="url(#barGrad1)" rx="5"/>
  <text x="160" y="180" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F2937">80</text>
  <text x="160" y="370" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">項目1</text>
  
  <!-- Bar 2: 65 -->
  <rect x="220" y="227.5" width="80" height="122.5" fill="url(#barGrad2)" rx="5"/>
  <text x="260" y="217.5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F2937">65</text>
  <text x="260" y="370" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">項目2</text>
  
  <!-- Bar 3: 90 -->
  <rect x="320" y="170" width="80" height="180" fill="url(#barGrad3)" rx="5"/>
  <text x="360" y="160" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F2937">90</text>
  <text x="360" y="370" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">項目3</text>
  
  <!-- Bar 4: 45 -->
  <rect x="420" y="252.5" width="80" height="97.5" fill="url(#barGrad4)" rx="5"/>
  <text x="460" y="242.5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F2937">45</text>
  <text x="460" y="370" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">項目4</text>
  
  <!-- Bar 5: 70 -->
  <rect x="520" y="210" width="80" height="140" fill="url(#barGrad5)" rx="5"/>
  <text x="560" y="200" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F2937">70</text>
  <text x="560" y="370" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">項目5</text>
</svg>
