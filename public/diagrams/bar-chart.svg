<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradBar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradBar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradBar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradBar4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradBar5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Y-axis -->
  <line x1="60" y1="40" x2="60" y2="320" stroke="#6B7280" stroke-width="2"/>
  
  <!-- X-axis -->
  <line x1="60" y1="320" x2="560" y2="320" stroke="#6B7280" stroke-width="2"/>
  
  <!-- Y-axis labels -->
  <text x="55" y="325" text-anchor="end" fill="#6B7280" font-family="Arial, sans-serif" font-size="11">0</text>
  <text x="55" y="265" text-anchor="end" fill="#6B7280" font-family="Arial, sans-serif" font-size="11">20</text>
  <text x="55" y="205" text-anchor="end" fill="#6B7280" font-family="Arial, sans-serif" font-size="11">40</text>
  <text x="55" y="145" text-anchor="end" fill="#6B7280" font-family="Arial, sans-serif" font-size="11">60</text>
  <text x="55" y="85" text-anchor="end" fill="#6B7280" font-family="Arial, sans-serif" font-size="11">80</text>
  <text x="55" y="45" text-anchor="end" fill="#6B7280" font-family="Arial, sans-serif" font-size="11">100</text>
  
  <!-- Grid lines -->
  <line x1="60" y1="265" x2="560" y2="265" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="60" y1="205" x2="560" y2="205" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="60" y1="145" x2="560" y2="145" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="60" y1="85" x2="560" y2="85" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Bar 1: 75 -->
  <rect x="100" y="125" width="60" height="195" fill="url(#gradBar1)" rx="4"/>
  <text x="130" y="115" text-anchor="middle" fill="#1E40AF" font-family="Arial, sans-serif" font-size="12" font-weight="bold">75</text>
  <text x="130" y="335" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11">項目A</text>
  
  <!-- Bar 2: 45 -->
  <rect x="180" y="205" width="60" height="115" fill="url(#gradBar2)" rx="4"/>
  <text x="210" y="195" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="12" font-weight="bold">45</text>
  <text x="210" y="335" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11">項目B</text>
  
  <!-- Bar 3: 90 -->
  <rect x="260" y="85" width="60" height="235" fill="url(#gradBar3)" rx="4"/>
  <text x="290" y="75" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="12" font-weight="bold">90</text>
  <text x="290" y="335" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11">項目C</text>
  
  <!-- Bar 4: 30 -->
  <rect x="340" y="245" width="60" height="75" fill="url(#gradBar4)" rx="4"/>
  <text x="370" y="235" text-anchor="middle" fill="#991B1B" font-family="Arial, sans-serif" font-size="12" font-weight="bold">30</text>
  <text x="370" y="335" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11">項目D</text>
  
  <!-- Bar 5: 60 -->
  <rect x="420" y="165" width="60" height="155" fill="url(#gradBar5)" rx="4"/>
  <text x="450" y="155" text-anchor="middle" fill="#6D28D9" font-family="Arial, sans-serif" font-size="12" font-weight="bold">60</text>
  <text x="450" y="335" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11">項目E</text>
  
  <!-- Title -->
  <text x="310" y="25" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="16" font-weight="bold">売上実績</text>
</svg>
