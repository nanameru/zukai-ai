<svg width="700" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="timelineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Timeline line -->
  <line x1="50" y1="150" x2="650" y2="150" stroke="#6366F1" stroke-width="4"/>
  
  <!-- Timeline points -->
  <circle cx="100" cy="150" r="12" fill="url(#timelineGrad)" stroke="white" stroke-width="3"/>
  <circle cx="250" cy="150" r="12" fill="url(#timelineGrad)" stroke="white" stroke-width="3"/>
  <circle cx="400" cy="150" r="12" fill="url(#timelineGrad)" stroke="white" stroke-width="3"/>
  <circle cx="550" cy="150" r="12" fill="url(#timelineGrad)" stroke="white" stroke-width="3"/>
  
  <!-- Event 1 -->
  <rect x="30" y="30" width="140" height="80" rx="8" fill="#F3F4F6" stroke="#6366F1" stroke-width="2"/>
  <text x="100" y="55" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="11" font-weight="bold">2024 Q1</text>
  <text x="100" y="75" text-anchor="middle" fill="#4B5563" font-family="Arial, sans-serif" font-size="10">プロジェクト開始</text>
  <text x="100" y="90" text-anchor="middle" fill="#4B5563" font-family="Arial, sans-serif" font-size="9">Project Start</text>
  <line x1="100" y1="110" x2="100" y2="138" stroke="#6366F1" stroke-width="2" stroke-dasharray="4,4"/>
  
  <!-- Event 2 -->
  <rect x="180" y="180" width="140" height="80" rx="8" fill="#F3F4F6" stroke="#6366F1" stroke-width="2"/>
  <text x="250" y="205" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="11" font-weight="bold">2024 Q2</text>
  <text x="250" y="225" text-anchor="middle" fill="#4B5563" font-family="Arial, sans-serif" font-size="10">設計・開発</text>
  <text x="250" y="240" text-anchor="middle" fill="#4B5563" font-family="Arial, sans-serif" font-size="9">Design &amp; Dev</text>
  <line x1="250" y1="180" x2="250" y2="162" stroke="#6366F1" stroke-width="2" stroke-dasharray="4,4"/>
  
  <!-- Event 3 -->
  <rect x="330" y="30" width="140" height="80" rx="8" fill="#F3F4F6" stroke="#6366F1" stroke-width="2"/>
  <text x="400" y="55" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="11" font-weight="bold">2024 Q3</text>
  <text x="400" y="75" text-anchor="middle" fill="#4B5563" font-family="Arial, sans-serif" font-size="10">テスト・改善</text>
  <text x="400" y="90" text-anchor="middle" fill="#4B5563" font-family="Arial, sans-serif" font-size="9">Testing &amp; Refine</text>
  <line x1="400" y1="110" x2="400" y2="138" stroke="#6366F1" stroke-width="2" stroke-dasharray="4,4"/>
  
  <!-- Event 4 -->
  <rect x="480" y="180" width="140" height="80" rx="8" fill="#F3F4F6" stroke="#6366F1" stroke-width="2"/>
  <text x="550" y="205" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="11" font-weight="bold">2024 Q4</text>
  <text x="550" y="225" text-anchor="middle" fill="#4B5563" font-family="Arial, sans-serif" font-size="10">リリース</text>
  <text x="550" y="240" text-anchor="middle" fill="#4B5563" font-family="Arial, sans-serif" font-size="9">Release</text>
  <line x1="550" y1="180" x2="550" y2="162" stroke="#6366F1" stroke-width="2" stroke-dasharray="4,4"/>
</svg>
