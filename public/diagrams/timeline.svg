<svg width="700" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradTimeline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Timeline line -->
  <line x1="50" y1="200" x2="650" y2="200" stroke="#3B82F6" stroke-width="4"/>
  
  <!-- Event 1 -->
  <circle cx="100" cy="200" r="12" fill="#3B82F6" stroke="white" stroke-width="3"/>
  <line x1="100" y1="200" x2="100" y2="100" stroke="#94A3B8" stroke-width="2"/>
  <rect x="20" y="60" width="160" height="40" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="100" y="80" text-anchor="middle" fill="#1E40AF" font-family="Arial, sans-serif" font-size="12" font-weight="bold">2024 Q1</text>
  <text x="100" y="95" text-anchor="middle" fill="#1E40AF" font-family="Arial, sans-serif" font-size="11">プロジェクト開始</text>
  
  <!-- Event 2 -->
  <circle cx="250" cy="200" r="12" fill="#10B981" stroke="white" stroke-width="3"/>
  <line x1="250" y1="200" x2="250" y2="100" stroke="#94A3B8" stroke-width="2"/>
  <rect x="170" y="60" width="160" height="40" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="250" y="80" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="12" font-weight="bold">2024 Q2</text>
  <text x="250" y="95" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="11">第1フェーズ完了</text>
  
  <!-- Event 3 -->
  <circle cx="400" cy="200" r="12" fill="#F59E0B" stroke="white" stroke-width="3"/>
  <line x1="400" y1="200" x2="400" y2="100" stroke="#94A3B8" stroke-width="2"/>
  <rect x="320" y="60" width="160" height="40" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="400" y="80" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="12" font-weight="bold">2024 Q3</text>
  <text x="400" y="95" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="11">リリース準備</text>
  
  <!-- Event 4 -->
  <circle cx="550" cy="200" r="12" fill="#EF4444" stroke="white" stroke-width="3"/>
  <line x1="550" y1="200" x2="550" y2="100" stroke="#94A3B8" stroke-width="2"/>
  <rect x="470" y="60" width="160" height="40" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
  <text x="550" y="80" text-anchor="middle" fill="#991B1B" font-family="Arial, sans-serif" font-size="12" font-weight="bold">2024 Q4</text>
  <text x="550" y="95" text-anchor="middle" fill="#991B1B" font-family="Arial, sans-serif" font-size="11">正式リリース</text>
  
  <!-- Bottom events -->
  <rect x="50" y="240" width="120" height="60" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1"/>
  <text x="110" y="265" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11" font-weight="bold">マイルストーン1</text>
  <text x="110" y="280" text-anchor="middle" fill="#6B7280" font-family="Arial, sans-serif" font-size="10">詳細情報1</text>
  
  <rect x="200" y="240" width="120" height="60" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1"/>
  <text x="260" y="265" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11" font-weight="bold">マイルストーン2</text>
  <text x="260" y="280" text-anchor="middle" fill="#6B7280" font-family="Arial, sans-serif" font-size="10">詳細情報2</text>
  
  <rect x="350" y="240" width="120" height="60" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1"/>
  <text x="410" y="265" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11" font-weight="bold">マイルストーン3</text>
  <text x="410" y="280" text-anchor="middle" fill="#6B7280" font-family="Arial, sans-serif" font-size="10">詳細情報3</text>
  
  <rect x="500" y="240" width="120" height="60" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1"/>
  <text x="560" y="265" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11" font-weight="bold">マイルストーン4</text>
  <text x="560" y="280" text-anchor="middle" fill="#6B7280" font-family="Arial, sans-serif" font-size="10">詳細情報4</text>
  
  <!-- Connecting lines from timeline to bottom -->
  <line x1="100" y1="200" x2="110" y2="240" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="250" y1="200" x2="260" y2="240" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="400" y1="200" x2="410" y2="240" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="550" y1="200" x2="560" y2="240" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
</svg>
