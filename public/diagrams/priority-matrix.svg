<svg width="700" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="priorityGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="priorityGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="priorityGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="priorityGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <!-- Arrow markers -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4B5563" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="350" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1F2937">優先度マトリックス</text>
  
  <!-- Background Grid Area -->
  <!-- x:100-600, y:70-430 -->
  
  <!-- Axis Labels -->
  <text x="40" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#4B5563" transform="rotate(-90 40 250)">重要度</text>
  <text x="350" y="470" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#4B5563">緊急度</text>
  
  <!-- High/Low Labels -->
  <text x="85" y="85" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="end" fill="#6B7280">高</text>
  <text x="85" y="425" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="end" fill="#6B7280">低</text>
  <text x="110" y="450" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#6B7280">高</text>
  <text x="590" y="450" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#6B7280">低</text>

  <!-- Quadrant 1: 緊急かつ重要 (左上) -->
  <rect x="100" y="70" width="250" height="180" rx="0" fill="#FEF2F2" stroke="#EF4444" stroke-width="1" opacity="0.8"/>
  <text x="225" y="100" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#991B1B">第1象限: 必須</text>
  <text x="225" y="120" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7F1D1D">（すぐやる）</text>
  
  <!-- Items Q1 -->
  <circle cx="150" cy="150" r="25" fill="url(#priorityGrad1)"/>
  <text x="150" y="156" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">A</text>
  <circle cx="260" cy="180" r="20" fill="url(#priorityGrad1)"/>
  <text x="260" y="185" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">B</text>

  <!-- Quadrant 2: 重要だが緊急でない (右上) -->
  <rect x="350" y="70" width="250" height="180" rx="0" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1" opacity="0.8"/>
  <text x="475" y="100" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1E40AF">第2象限: 計画</text>
  <text x="475" y="120" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1E3A8A">（いつやるか決める）</text>
  
  <!-- Items Q2 -->
  <circle cx="400" cy="160" r="25" fill="url(#priorityGrad3)"/>
  <text x="400" y="166" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">C</text>
  <circle cx="520" cy="140" r="22" fill="url(#priorityGrad3)"/>
  <text x="520" y="146" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">D</text>
  <circle cx="500" cy="210" r="18" fill="url(#priorityGrad3)"/>
  <text x="500" y="215" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">E</text>

  <!-- Quadrant 3: 緊急だが重要でない (左下) -->
  <rect x="100" y="250" width="250" height="180" rx="0" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1" opacity="0.8"/>
  <text x="225" y="280" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#92400E">第3象限: 委任</text>
  <text x="225" y="300" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#78350F">（誰かに頼む）</text>
  
  <!-- Items Q3 -->
  <circle cx="180" cy="350" r="20" fill="url(#priorityGrad2)"/>
  <text x="180" y="355" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">F</text>
  <circle cx="280" cy="330" r="22" fill="url(#priorityGrad2)"/>
  <text x="280" y="336" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">G</text>

  <!-- Quadrant 4: 緊急でも重要でもない (右下) -->
  <rect x="350" y="250" width="250" height="180" rx="0" fill="#ECFDF5" stroke="#10B981" stroke-width="1" opacity="0.8"/>
  <text x="475" y="280" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#065F46">第4象限: 排除</text>
  <text x="475" y="300" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#047857">（やめる）</text>

  <!-- Items Q4 -->
  <circle cx="420" cy="360" r="18" fill="url(#priorityGrad4)"/>
  <text x="420" y="365" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">H</text>
  <circle cx="540" cy="380" r="15" fill="url(#priorityGrad4)"/>
  <text x="540" y="384" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">I</text>
  <circle cx="500" cy="330" r="15" fill="url(#priorityGrad4)"/>
  <text x="500" y="334" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">J</text>

  <!-- Center Divider Lines -->
  <line x1="350" y1="70" x2="350" y2="430" stroke="#6B7280" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="100" y1="250" x2="600" y2="250" stroke="#6B7280" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Outer Frame -->
  <rect x="100" y="70" width="500" height="360" rx="0" fill="none" stroke="#4B5563" stroke-width="2"/>

</svg>
