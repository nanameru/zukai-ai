<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
    <!-- グラデーション定義 (よりソフトでモダンに) -->
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 全体背景: わずかにオフホワイトで目に優しく -->
  <rect width="800" height="400" fill="#F8FAFC"/>

  <!-- タイトルエリア -->
  <text x="50" y="45" font-size="20" font-weight="700" fill="#1E293B">プロジェクト工程表</text>
  <text x="750" y="45" font-size="12" fill="#64748B" text-anchor="end">Updated: 2023.10.01</text>
  
  <!-- ヘッダー領域 (フラット) -->
  <rect x="160" y="65" width="600" height="32" fill="#EEF2FF" rx="4"/>

  <!-- 行の背景 (ゼブラストライプをより繊細に) -->
  <rect x="40" y="105" width="720" height="40" fill="#FFFFFF" rx="4"/>
  <rect x="40" y="145" width="720" height="40" fill="#F1F5F9" rx="4"/> <!-- 薄いグレー -->
  <rect x="40" y="185" width="720" height="40" fill="#FFFFFF" rx="4"/>
  <rect x="40" y="225" width="720" height="40" fill="#F1F5F9" rx="4"/>
  <rect x="40" y="265" width="720" height="40" fill="#FFFFFF" rx="4"/>
  <rect x="40" y="305" width="720" height="40" fill="#F1F5F9" rx="4"/>

  <!-- 縦グリッド線 (実線・薄色) -->
  <path d="M260 65 V350 M360 65 V350 M460 65 V350 M560 65 V350 M660 65 V350" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="160" y1="65" x2="160" y2="350" stroke="#94A3B8" stroke-width="1"/>
  <line x1="760" y1="65" x2="760" y2="350" stroke="#94A3B8" stroke-width="1"/>

  <!-- 「今日」の線 (アクセント) -->
  <line x1="480" y1="65" x2="480" y2="350" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="480" y="60" font-size="10" fill="#EF4444" text-anchor="middle" font-weight="600">Today</text>

  <!-- 月ラベル -->
  <g font-size="12" font-weight="600" text-anchor="middle" fill="#475569">
    <text x="210" y="86">1月</text>
    <text x="310" y="86">2月</text>
    <text x="410" y="86">3月</text>
    <text x="510" y="86">4月</text>
    <text x="610" y="86">5月</text>
    <text x="710" y="86">6月</text>
  </g>

  <!-- タスク名 (左寄せ・太字) -->
  <g font-size="13" font-weight="500" text-anchor="start" fill="#334155">
    <text x="50" y="130">要件定義</text>
    <text x="50" y="170">基本設計</text>
    <text x="50" y="210">詳細設計</text>
    <text x="50" y="250">開発実装</text>
    <text x="50" y="290">テスト</text>
    <text x="50" y="330">リリース</text>
  </g>

  <!-- タスクバー (フラット・角丸強め) -->
  <!-- Task 1 -->
  <rect x="190" y="113" width="90" height="24" rx="12" fill="url(#gradBlue)"/>
  
  <!-- Task 2 -->
  <rect x="270" y="153" width="100" height="24" rx="12" fill="url(#gradPurple)"/>

  <!-- Task 3 -->
  <rect x="350" y="193" width="120" height="24" rx="12" fill="url(#gradPurple)"/>

  <!-- Task 4 -->
  <rect x="430" y="233" width="180" height="24" rx="12" fill="url(#gradGreen)"/>

  <!-- Task 5 -->
  <rect x="590" y="273" width="140" height="24" rx="12" fill="url(#gradOrange)"/>

  <!-- Task 6 -->
  <rect x="710" y="313" width="40" height="24" rx="12" fill="url(#gradBlue)"/>

  <!-- マイルストーン (シンプルに) -->
  <circle cx="470" cy="193" r="5" fill="#EF4444" stroke="white" stroke-width="2"/>
  <circle cx="610" cy="233" r="5" fill="#EF4444" stroke="white" stroke-width="2"/>

  <!-- 注釈テキスト -->
  <g font-size="11" text-anchor="middle" fill="white" font-weight="500" style="pointer-events: none;">
    <text x="235" y="129">1.5ヶ月</text>
    <text x="320" y="169">2ヶ月</text>
    <text x="410" y="209">2ヶ月</text>
    <text x="520" y="249">3ヶ月</text>
    <text x="660" y="289">2.5ヶ月</text>
    <text x="730" y="329">0.5</text>
  </g>
</svg>
