<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 影のフィルター -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    
    <!-- グラデーション定義 -->
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FBBF24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 全体背景 -->
  <rect width="800" height="400" fill="white"/>

  <!-- タイトル -->
  <text x="400" y="40" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1F2937">プロジェクト工程表</text>
  
  <!-- ヘッダー領域 -->
  <rect x="150" y="350" width="600" height="30" fill="#F3F4F6" rx="4"/>

  <!-- 行の背景（ゼブラストライプ） -->
  <rect x="50" y="70" width="720" height="40" fill="#F9FAFB" rx="4"/>
  <!-- 2行目は白 -->
  <rect x="50" y="150" width="720" height="40" fill="#F9FAFB" rx="4"/>
  <!-- 4行目は白 -->
  <rect x="50" y="230" width="720" height="40" fill="#F9FAFB" rx="4"/>
  <!-- 6行目は白 -->

  <!-- 縦グリッド線 -->
  <line x1="150" y1="60" x2="150" y2="350" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="250" y1="60" x2="250" y2="350" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="350" y1="60" x2="350" y2="350" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="450" y1="60" x2="450" y2="350" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="550" y1="60" x2="550" y2="350" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="650" y1="60" x2="650" y2="350" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="750" y1="60" x2="750" y2="350" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- 月ラベル -->
  <g font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#4B5563">
    <text x="200" y="370">1月</text>
    <text x="300" y="370">2月</text>
    <text x="400" y="370">3月</text>
    <text x="500" y="370">4月</text>
    <text x="600" y="370">5月</text>
    <text x="700" y="370">6月</text>
  </g>

  <!-- タスク名 -->
  <g font-family="sans-serif" font-size="13" text-anchor="end" fill="#374151">
    <text x="140" y="95">要件定義</text>
    <text x="140" y="135">基本設計</text>
    <text x="140" y="175">詳細設計</text>
    <text x="140" y="215">開発実装</text>
    <text x="140" y="255">テスト</text>
    <text x="140" y="295">リリース</text>
  </g>

  <!-- タスクバー & ラベル -->
  <!-- Task 1: 要件定義 -->
  <rect x="180" y="80" width="90" height="24" rx="6" fill="url(#gradBlue)" filter="url(#dropShadow)"/>
  
  <!-- Task 2: 基本設計 -->
  <rect x="260" y="120" width="100" height="24" rx="6" fill="url(#gradPurple)" filter="url(#dropShadow)"/>

  <!-- Task 3: 詳細設計 -->
  <rect x="340" y="160" width="120" height="24" rx="6" fill="url(#gradPurple)" filter="url(#dropShadow)"/>

  <!-- Task 4: 開発実装 -->
  <rect x="420" y="200" width="180" height="24" rx="6" fill="url(#gradGreen)" filter="url(#dropShadow)"/>

  <!-- Task 5: テスト -->
  <rect x="580" y="240" width="140" height="24" rx="6" fill="url(#gradAmber)" filter="url(#dropShadow)"/>

  <!-- Task 6: リリース -->
  <rect x="700" y="280" width="60" height="24" rx="6" fill="url(#gradBlue)" filter="url(#dropShadow)"/>

  <!-- マイルストーン（菱形） -->
  <!-- 設計完了 -->
  <g filter="url(#dropShadow)">
    <path d="M460 160 L470 172 L460 184 L450 172 Z" fill="#EF4444" stroke="white" stroke-width="1.5"/>
  </g>
  
  <!-- 開発完了 -->
  <g filter="url(#dropShadow)">
    <path d="M600 200 L610 212 L600 224 L590 212 Z" fill="#EF4444" stroke="white" stroke-width="1.5"/>
  </g>

  <!-- 注釈テキスト（期間など） -->
  <g font-family="sans-serif" font-size="10" text-anchor="middle" fill="white" style="pointer-events: none;">
    <text x="225" y="96">1.5ヶ月</text>
    <text x="310" y="136">2ヶ月</text>
    <text x="400" y="176">2ヶ月</text>
    <text x="510" y="216">3ヶ月</text>
    <text x="650" y="256">2.5ヶ月</text>
    <text x="730" y="296">1ヶ月</text>
  </g>
</svg>
