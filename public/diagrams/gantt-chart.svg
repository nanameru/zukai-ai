<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ganttGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ganttGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ganttGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ganttGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1F2937">ガントチャート</text>
  
  <!-- Y-axis -->
  <line x1="150" y1="60" x2="150" y2="350" stroke="#9CA3AF" stroke-width="2"/>
  
  <!-- X-axis -->
  <line x1="150" y1="350" x2="750" y2="350" stroke="#9CA3AF" stroke-width="2"/>
  
  <!-- Month labels -->
  <text x="200" y="345" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6B7280">1月</text>
  <text x="300" y="345" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6B7280">2月</text>
  <text x="400" y="345" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6B7280">3月</text>
  <text x="500" y="345" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6B7280">4月</text>
  <text x="600" y="345" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6B7280">5月</text>
  <text x="700" y="345" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6B7280">6月</text>
  
  <!-- Grid lines -->
  <line x1="200" y1="60" x2="200" y2="350" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="300" y1="60" x2="300" y2="350" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="400" y1="60" x2="400" y2="350" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="500" y1="60" x2="500" y2="350" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="600" y1="60" x2="600" y2="350" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="700" y1="60" x2="700" y2="350" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Task 1 -->
  <text x="140" y="100" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#374151">タスク1</text>
  <rect x="180" y="85" width="120" height="25" rx="5" fill="url(#ganttGrad1)"/>
  <text x="240" y="102" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">1-2月</text>
  
  <!-- Task 2 -->
  <text x="140" y="140" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#374151">タスク2</text>
  <rect x="280" y="125" width="140" height="25" rx="5" fill="url(#ganttGrad2)"/>
  <text x="350" y="142" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">2-3月</text>
  
  <!-- Task 3 -->
  <text x="140" y="180" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#374151">タスク3</text>
  <rect x="200" y="165" width="200" height="25" rx="5" fill="url(#ganttGrad3)"/>
  <text x="300" y="182" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">1-3月</text>
  
  <!-- Task 4 -->
  <text x="140" y="220" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#374151">タスク4</text>
  <rect x="420" y="205" width="180" height="25" rx="5" fill="url(#ganttGrad4)"/>
  <text x="510" y="222" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">3-5月</text>
  
  <!-- Task 5 -->
  <text x="140" y="260" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#374151">タスク5</text>
  <rect x="480" y="245" width="220" height="25" rx="5" fill="url(#ganttGrad1)"/>
  <text x="590" y="262" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">4-6月</text>
  
  <!-- Task 6 -->
  <text x="140" y="300" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#374151">タスク6</text>
  <rect x="580" y="285" width="120" height="25" rx="5" fill="url(#ganttGrad2)"/>
  <text x="640" y="302" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">5-6月</text>
  
  <!-- Milestone markers -->
  <polygon points="300,85 310,95 300,105 290,95" fill="#EF4444" stroke="white" stroke-width="2"/>
  <text x="300" y="75" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#DC2626">マイルストーン</text>
  
  <polygon points="500,165 510,175 500,185 490,175" fill="#EF4444" stroke="white" stroke-width="2"/>
  <text x="500" y="155" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#DC2626">マイルストーン</text>
</svg>
