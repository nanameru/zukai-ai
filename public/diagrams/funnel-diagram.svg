<svg width="500" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="funnelGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="funnelGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818CF8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="funnelGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#818CF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="funnelGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C4B5FD;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Stage 1: Top (Widest) -->
  <path d="M 100 80 L 400 80 L 380 140 L 120 140 Z" fill="url(#funnelGrad1)" stroke="#312E81" stroke-width="2"/>
  <text x="250" y="115" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">認知</text>
  <text x="250" y="135" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">10,000人</text>
  <text x="400" y="115" text-anchor="start" fill="#1F2937" font-family="Arial, sans-serif" font-size="11" font-weight="bold">100%</text>
  
  <!-- Stage 2 -->
  <path d="M 120 140 L 380 140 L 360 200 L 140 200 Z" fill="url(#funnelGrad2)" stroke="#312E81" stroke-width="2"/>
  <text x="250" y="175" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">興味</text>
  <text x="250" y="195" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">3,000人</text>
  <text x="400" y="175" text-anchor="start" fill="#1F2937" font-family="Arial, sans-serif" font-size="11" font-weight="bold">30%</text>
  
  <!-- Stage 3 -->
  <path d="M 140 200 L 360 200 L 340 260 L 160 260 Z" fill="url(#funnelGrad3)" stroke="#312E81" stroke-width="2"/>
  <text x="250" y="235" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">検討</text>
  <text x="250" y="255" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">1,000人</text>
  <text x="400" y="235" text-anchor="start" fill="#1F2937" font-family="Arial, sans-serif" font-size="11" font-weight="bold">10%</text>
  
  <!-- Stage 4: Bottom (Narrowest) -->
  <path d="M 160 260 L 340 260 L 320 320 L 180 320 Z" fill="url(#funnelGrad4)" stroke="#312E81" stroke-width="2"/>
  <text x="250" y="295" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">購入</text>
  <text x="250" y="315" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">300人</text>
  <text x="400" y="295" text-anchor="start" fill="#1F2937" font-family="Arial, sans-serif" font-size="11" font-weight="bold">3%</text>
  
  <!-- Conversion arrows -->
  <path d="M 250 140 Q 250 150 250 160" stroke="#E5E7EB" stroke-width="2" fill="none" marker-end="url(#arrowFunnel)"/>
  <path d="M 250 200 Q 250 210 250 220" stroke="#E5E7EB" stroke-width="2" fill="none" marker-end="url(#arrowFunnel)"/>
  <path d="M 250 260 Q 250 270 250 280" stroke="#E5E7EB" stroke-width="2" fill="none" marker-end="url(#arrowFunnel)"/>
  
  <defs>
    <marker id="arrowFunnel" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9CA3AF" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="250" y="30" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="18" font-weight="bold">マーケティングファネル</text>
  
  <!-- Description -->
  <text x="250" y="370" text-anchor="middle" fill="#6B7280" font-family="Arial, sans-serif" font-size="12">顧客獲得プロセスの各段階</text>
  
  <!-- Conversion rates -->
  <text x="250" y="400" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="11">転換率: 認知→興味 30% | 興味→検討 33% | 検討→購入 30%</text>
</svg>
