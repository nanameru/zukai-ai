<svg width="900" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="journeyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="450" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1F2937">顧客ジャーニーマップ</text>
  
  <!-- Journey path -->
  <path d="M 100 250 Q 200 200, 300 250 T 500 250 T 750 250" 
        stroke="url(#journeyGrad)" stroke-width="4" fill="none" stroke-dasharray="5,5"/>
  
  <!-- Stage 1: 認知 -->
  <circle cx="150" cy="250" r="40" fill="#3B82F6" stroke="white" stroke-width="3"/>
  <text x="150" y="245" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">認知</text>
  <text x="150" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Awareness</text>
  
  <rect x="80" y="120" width="140" height="80" rx="5" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="150" y="145" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1E40AF">タッチポイント</text>
  <text x="150" y="165" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1E3A8A">• 広告</text>
  <text x="150" y="180" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1E3A8A">• SNS</text>
  <text x="150" y="195" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1E3A8A">• 口コミ</text>
  
  <!-- Stage 2: 検討 -->
  <circle cx="300" cy="250" r="40" fill="#8B5CF6" stroke="white" stroke-width="3"/>
  <text x="300" y="245" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">検討</text>
  <text x="300" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Consideration</text>
  
  <rect x="230" y="120" width="140" height="80" rx="5" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2"/>
  <text x="300" y="145" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#5B21B6">タッチポイント</text>
  <text x="300" y="165" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#4C1D95">• ウェブサイト</text>
  <text x="300" y="180" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#4C1D95">• レビュー</text>
  <text x="300" y="195" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#4C1D95">• 比較サイト</text>
  
  <!-- Stage 3: 購入 -->
  <circle cx="450" cy="250" r="40" fill="#F59E0B" stroke="white" stroke-width="3"/>
  <text x="450" y="245" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">購入</text>
  <text x="450" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Purchase</text>
  
  <rect x="380" y="120" width="140" height="80" rx="5" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="450" y="145" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400E">タッチポイント</text>
  <text x="450" y="165" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#78350F">• オンラインストア</text>
  <text x="450" y="180" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#78350F">• 店舗</text>
  <text x="450" y="195" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#78350F">• カスタマーサポート</text>
  
  <!-- Stage 4: 利用 -->
  <circle cx="600" cy="250" r="40" fill="#10B981" stroke="white" stroke-width="3"/>
  <text x="600" y="245" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">利用</text>
  <text x="600" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Usage</text>
  
  <rect x="530" y="120" width="140" height="80" rx="5" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="600" y="145" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#065F46">タッチポイント</text>
  <text x="600" y="165" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#047857">• 製品使用</text>
  <text x="600" y="180" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#047857">• ヘルプセンター</text>
  <text x="600" y="195" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#047857">• コミュニティ</text>
  
  <!-- Stage 5: 推奨 (Shifted to x=750) -->
  <circle cx="750" cy="250" r="40" fill="#EF4444" stroke="white" stroke-width="3"/>
  <text x="750" y="245" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">推奨</text>
  <text x="750" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Advocacy</text>
  
  <rect x="680" y="120" width="140" height="80" rx="5" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
  <text x="750" y="145" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#991B1B">タッチポイント</text>
  <text x="750" y="165" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7F1D1D">• レビュー投稿</text>
  <text x="750" y="180" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7F1D1D">• 紹介プログラム</text>
  <text x="750" y="195" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7F1D1D">• リピート購入</text>
  
  <!-- Emotion line -->
  <text x="50" y="350" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6B7280">感情の変化:</text>
  <line x1="150" y1="340" x2="750" y2="340" stroke="#9CA3AF" stroke-width="2"/>
  
  <!-- Emotion indicators -->
  <circle cx="150" cy="340" r="8" fill="#3B82F6"/>
  <text x="150" y="365" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6B7280">中立</text>
  
  <circle cx="300" cy="330" r="8" fill="#8B5CF6"/>
  <text x="300" y="365" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6B7280">興味</text>
  
  <circle cx="450" cy="325" r="8" fill="#F59E0B"/>
  <text x="450" y="365" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6B7280">期待</text>
  
  <circle cx="600" cy="320" r="8" fill="#10B981"/>
  <text x="600" y="365" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6B7280">満足</text>
  
  <circle cx="750" cy="315" r="8" fill="#EF4444"/>
  <text x="750" y="365" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6B7280">興奮</text>
  
  <!-- Pain points -->
  <text x="50" y="420" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#DC2626">課題ポイント:</text>
  <text x="50" y="440" font-family="Arial, sans-serif" font-size="11" fill="#991B1B">• 検討段階での情報不足</text>
  <text x="50" y="460" font-family="Arial, sans-serif" font-size="11" fill="#991B1B">• 購入プロセスの複雑さ</text>
  <text x="50" y="480" font-family="Arial, sans-serif" font-size="11" fill="#991B1B">• サポートへのアクセス困難</text>
</svg>